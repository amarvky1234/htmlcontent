<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX60</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
</head>
<body>
        <output>Hello</output><br><br>
        <button onclick="document.write('Button Pushed')">Push</button>
        <br><br>
        <button onclick="op.value='Button Pulled'">Pull</button>
        <output id="op"></output>
        <br><br>
        <button onclick="dt.value=new Date()">Show Date</button>
        <output id="dt"></output>
</body>
</html>
