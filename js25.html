<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS25</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
</head>
<body>
        <h3>demo on while loop</h3>
        <script>
                let i=1;
                while(i<=5){
                    document.write("Hi <br>");
                    i++;
                }
                document.write("<br>")

                i=1;
                while(i<=20)
                {
                    document.write(i+" ")
                    i++;
                }
                document.write("<br>")

                i=20;
                while(i>=1)
                {
                    document.write(i+" ")
                    i--
                }
        </script>
</body>
</html>
