        <h2>demo on radio buttons</h2>
        <form action="test.php">
            <fieldset>
                <legend>Gender</legend>
                <input type="radio" name="gen" id="gen1" value="male" checked><label>Male</label>
                <input type="radio" name="gen" id="gen2" value="female"><label>Female</label>
                <input type="radio" name="gen" id="gen3" value="other"><label>Others</label>
            </fieldset>
            <br>
            <fieldset>

                <input type="radio" name="ms" id="ms1" value="single" checked><label>Single</label>

                <input type="radio" name="ms" id="ms3" value="divorce"><label>Divorce</label>
                <input type="radio" name="ms" id="ms4" value="widowed"><label>Widowed</label>
                <input type="radio" name="ms" id="ms5" value="nuns"><label>Never Married</label>
