		function total(...n)   //rest parameter
		{
		   let tot=0;
		   for(let x of n) {
				if(typeof x === "number")
					tot=tot+x;
		   }
		   return tot;
		}	
	</script>

</head>
<body>
            <h3>Demo on rest parameter (since JS6</h3>
            <script>
                     document.write("Total Val : " + total(10,25,60) + "<br>");  //call1	
                     document.write("Total Val : " + total() + "<br>");  //call2
                     document.write("Total Val : " + total(1,3,5,8,6,9,4,2,7) + "<br>");  //call3
                     document.write("Total Val : " + total(10,"ram",20, 30,"sam",40,true) + "<br>");  //call4
            </script>
