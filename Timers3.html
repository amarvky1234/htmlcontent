<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timers3</title>
    <link rel="icon" href="images/logo3.jpg">
</head>
<body>
        <h1 align="center">Image Slide Show</h1>
	    <div style="width:100%;height:350px;text-align:center;">
			<img src="images/animal.jpg" style="width:70%;height:100%;"/>
	    </div>
            <script>
                const imgs=["images/animal.jpg", "images/art.jpg", "images/person.jpg", "images/metro.jpg", "images/nature.jpg", "images/parrot.avif", "images/monalisha.webp", "sunset.avif", "images/stadium.jpg", "images/joker.jpg"];
                let index=1;
                setInterval( function(){
                            if(index===imgs.length)
                                index=0;

                            document.images[0].src=imgs[index];
                            index++;
                        }, "3000");
            </script>

</body>
</html>
