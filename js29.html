<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS29</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
    <link rel="stylesheet" href="marksstyles.css">
</head>
<body>
        <table>
                <caption>Student Marks Report</caption>
                <tr>
                        <td><label>RollNo</label></td>
                        <td><input type="text" id="rno"></td>
                </tr>
                <tr>
                        <td><label>Name</label></td>
                        <td><input type="text" id="nm"></td>
                </tr>
                <tr>
                        <td><label>Marks in</label></td>
                </tr>
                <tr>
                        <td><label>HTML</label></td>
                        <td><input type="text" id="html"></td>
                </tr>
                <tr>
                        <td><label>CSS</label></td>
                        <td><input type="text" id="css"></td>
                </tr>
                <tr>
                        <td><label>JavaScript</label></td>
                        <td><input type="text" id="js"></td>
                </tr>
                <tr>
                        <td><label>BootStrap</label></td>
                        <td><input type="text" id="bs"></td>
                </tr>
                <tr align="center">
                        <td colspan="2"><button onclick="getResult()">Get Result</button></td>
                </tr>
                <tr align="center">
                        <td colspan="2">
                            <output id="total"></output><br>
                            <output id="average"></output><br>
                            <output id="grade"></output>
                        </td>
                </tr>
        </table>

        <script>
                function getResult()
                {
                    let hm, cm, jm, bm, tot, avg, grd;
                    hm =+ html.value;
                    cm =+ css.value;
                    jm =+ js.value;
                    bm =+ bs.value;

                    tot = hm+cm+jm+bm;
                    avg = tot/4;

                    if(hm>39&&cm>39&&jm>39&&bm>39){
                        if(avg>=90){
                            grd = "A1"
                        }else if(avg>=80){
                            grd = "A"
                        }else if(avg>=70){
                            grd = "B1"
                        }else if(avg>=60){
                            grd = "B"
                        }else if(avg>=50){
                            grd = "C"
                        }else{
                            grd = "D"
                        }
                    }else{
                        grd = "Fail"
                    }

                    total.value="Total Marks   :"+tot;
                    average.value="Average     :"+avg;
                    grade.value="Grade         :"+grd;
                }
        </script>
</body>
</html>
