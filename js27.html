<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS27</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
</head>
<body>
        <h3>demo on do while loop</h3>
        <script>
                let i=1;
                do{
                    document.write(i+" ")
                    i++;
                }while(i<=20)
                document.write("<br>")
                
                i=20;
                do{
                    document.write(i+" ")
                    i--;
                }while(i>=1)
        </script>
</body>
</html>
