<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>
    <div class="container mt-5">
        <h1 style="text-align: center;">Beautiful Card Design</h1>
        <div class="card shadow-lg border-0 rounded-4 p-3 bg-dark text-light">

            <img src="https://picsum.photos/500/250" class="card-img-top rounded-4" alt="image">

            <div class="card-body">
                <h2 class="card-title fw-bold">Modern Card</h2>

                <p class="card-text text-secondary">
                    This is a stylish Bootstrap card with dark theme,
                    shadow and rounded corners.
                </p>

                <button class="btn btn-primary rounded-pill px-4">
                    Explore
                </button>
            </div>

        </div>
    </div>
</body>
</html>
