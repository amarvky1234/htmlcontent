<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calculator-card {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        .display-screen {
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 0.5rem;
            font-size: 2rem;
            text-align: right;
            padding: 1rem;
            overflow-x: auto;
            white-space: nowrap;
            min-height: 76px;
        }

        .btn-calc {
            font-size: 1.25rem;
            font-weight: 600;
            padding: 1.2rem 0;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-calc:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center p-3">
        <div class="card calculator-card p-4">
            <div class="mb-3">
                <div id="display" class="display-screen text-success font-monospace">0</div>
            </div>

            <div class="row g-2">
                <div class="col-3"><button class="btn btn-outline-danger btn-calc w-100"
                        onclick="clearDisplay()">C</button></div>
                <div class="col-3"><button class="btn btn-outline-warning btn-calc w-100"
                        onclick="backspace()">⌫</button></div>
                <div class="col-3"><button class="btn btn-secondary btn-calc w-100"
                        onclick="appendValue('%')">%</button></div>
                <div class="col-3"><button class="btn btn-warning btn-calc w-100 text-dark"
                        onclick="appendValue('/')">÷</button></div>

                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('7')">7</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('8')">8</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('9')">9</button>
                </div>
                <div class="col-3"><button class="btn btn-warning btn-calc w-100 text-dark"
                        onclick="appendValue('*')">×</button></div>

                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('4')">4</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('5')">5</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('6')">6</button>
                </div>
                <div class="col-3"><button class="btn btn-warning btn-calc w-100 text-dark"
                        onclick="appendValue('-')">-</button></div>

                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('1')">1</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('2')">2</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('3')">3</button>
                </div>
                <div class="col-3"><button class="btn btn-warning btn-calc w-100 text-dark"
                        onclick="appendValue('+')">+</button></div>

                <div class="col-6"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('0')">0</button>
                </div>
                <div class="col-3"><button class="btn btn-dark btn-calc w-100" onclick="appendValue('.')">.</button>
                </div>
                <div class="col-3"><button class="btn btn-success btn-calc w-100" onclick="calculate()">=</button></div>
            </div>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let shouldResetDisplay = false;

        function appendValue(value) {
            if (display.innerText === '0' && !isNaN(value) || shouldResetDisplay) {
                display.innerText = value;
                shouldResetDisplay = false;
            } else {
                // Prevent multiple consecutive operators
                const lastChar = display.innerText.slice(-1);
                if (['+', '-', '*', '/', '%', '.'].includes(lastChar) && ['+', '-', '*', '/', '%', '.'].includes(value)) {
                    return;
                }
                display.innerText += value;
            }
        }

        function clearDisplay() {
            display.innerText = '0';
        }

        function backspace() {
            if (display.innerText.length > 1) {
                display.innerText = display.innerText.slice(0, -1);
            } else {
                display.innerText = '0';
            }
        }

        function calculate() {
            try {
                // Evaluate the string expression safely
                // Using Function instead of eval() for a slightly safer approach in simple apps
                let expression = display.innerText;

                // Handle percentages simply (e.g., 50% -> 50/100)
                expression = expression.replace(/%/g, '/100');

                let result = new Function('return ' + expression)();

                // Check for division by zero or invalid numbers
                if (result === Infinity || isNaN(result)) {
                    display.innerText = 'Error';
                } else {
                    // Round to maximum 8 decimal places to avoid floating point issues (e.g., 0.1 + 0.2)
                    display.innerText = Math.round(result * 100000000) / 100000000;
                }
                shouldResetDisplay = true;
            } catch (error) {
                display.innerText = 'Error';
                shouldResetDisplay = true;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
