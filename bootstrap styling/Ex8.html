<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
    <style>
        h1{
            color: rgb(70, 66, 147);
        }
    </style>
</head>
<body>
    <!-- 1. Container Classes
        Class	            Purpose
        container	            Responsive fixed width
        container-fluid	        100% width
     -->
    <div class="border border-4 mb-4">
        <h1>Container Classes</h1>
        <div class="container">
            Fixed width container
        </div>
        <div class="container-fluid">
            Full width container
        </div>
    </div>

    <!-- 2. Grid System 
        Class	               Purpose
        row                    Creates row
        col	                   Auto column
        col-6	               50% width
        col-md-4	           4 columns on medium screens
    -->
    <div class="border border-4 mb-4">
        <h1>Grid System</h1>
        <div class="row">
            <div class="col-md-4 bg-primary">
                Column 1
            </div>
            <div class="col-md-4 bg-success">
                Column 2
            </div>
            <div class="col-md-4 bg-danger">
                Column 3
            </div>
        </div>
    </div>

    <!--3. Margin Classes
        Class	    Meaning
        m-3	        Margin all sides
        mt-3	    Margin top
        mb-3	    Margin bottom
        ms-3	    Margin left/start
        me-3	    Margin right/end
    -->
    <div class="border border-4 mb-4">
        <h1>Margin Classes</h1>
        <div class="m-5">All Sides Margin</div>
        <div class="mt-5">Top Margin</div>
        <div class="mb-5">Bottom margin</div>
        <div class="ms-5">Left margin</div>
        <div class="me-5">Right margin</div>
    </div>

    <!-- 4. Padding Classes 
        Class	    Meaning
        p-3	        Padding all sides
        pt-3	    Padding top
        pb-3	    Padding bottom
        ps-3	    Padding left/start
        pe-3	    Padding right/end
     -->
     <div class="border border-4 mb-4">
        <h1>Padding Classes</h1>
        <div class="p-5">
            Padding on all sides
        </div>

        <div class="pt-5">
            Padding top
        </div>
     </div>

    <!--5. Text Classes
    Class	        Purpose
    text-center	    Center align
    text-start	    Left align
    text-end	    Right align
    text-primary	Blue text
    text-success	Green text
    fw-bold	        Bold
    fst-italic	    Italic
    -->
    <div class="border border-4 mb-4">
        <h1>Text Classes</h1>
        
        <h2 class="text-center">
            Center Text
        </h2>

        <p class="text-danger">
            Red Text
        </p>

        <p class="fw-bold">
            Bold Text
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
