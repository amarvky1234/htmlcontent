<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #141414;
            color: white;
        }

        .hero {
            height: 90vh;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.7),
                    rgba(0, 0, 0, 0.7)),
                    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba");
            background-size: cover;
            background-position: center;
        }

        .movie-card {
            transition: .3s;
            cursor: pointer;
        }

        .movie-card:hover {
            transform: scale(1.08);
        }

        .movie-img {
            height: 250px;  
            object-fit: cover;          
        }
    </style>
</head>
<body>
    <!--Navbar-->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold fs-2">
                NETFLIX
            </a>
            <div>
                <button class="btn btn-danger">
                    Sign In
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero d-flex align-items-center">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h1 class="display-3 fw-bold">
                        Unlimited Movies, TV Shows and More
                    </h1>

                    <p class="lead mt-3">
                        Watch anywhere. Cancel anytime.
                    </p>

                    <button class="btn btn-danger btn-lg me-2">
                        <i class="bi bi-play-fill"></i>
                        Play
                    </button>

                    <button class="btn btn-secondary btn-lg">
                        <i class="bi bi-info-circle"></i>
                        More Info
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Trending -->
    <div class="container my-5">
        <h2 class="mb-4">
            Trending Now
        </h2>
        <div class="row g-4">
            <div class="col-md-3">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/300/400?1"
                        class="card-img-top movie-img">
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-dark border-0 movie-card">
                    <img
                        src="https://picsum.photos/300/400?2"
                        class="card-img-top movie-img">
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-dark border-0 movie-card">
                    <img
                        src="https://picsum.photos/300/400?3"
                        class="card-img-top movie-img">
                </div>
            </div>

            <div class="col-md-3">
                <div class="card bg-dark border-0 movie-card">
                    <img
                        src="https://picsum.photos/300/400?4"
                        class="card-img-top movie-img">
                </div>
        </div>
    </div>

    <!-- Popular Movies -->
    <div class="container my-5">
        <h2 class="mb-4">
            Popular Movies
        </h2>

        <div class="row g-4">

            <div class="col-md-2">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/250/350?5"
                        class="card-img-top movie-img">
                </div>
            </div>
            <div class="col-md-2">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/250/350?6"
                        class="card-img-top movie-img">
                </div>
            </div>

            <div class="col-md-2">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/250/350?7"
                        class="card-img-top movie-img">
                </div>
            </div>

            <div class="col-md-2">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/250/350?8"
                        class="card-img-top movie-img">
                </div>
            </div>

            <div class="col-md-2">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/250/350?9"
                        class="card-img-top movie-img">
                </div>
            </div>

            <div class="col-md-2">
                <div class="card bg-dark border-0 movie-card">
                    <img src="https://picsum.photos/250/350?10"
                        class="card-img-top movie-img">
                </div>
            </div>

        </div>

        <!--Footer-->
        <footer class="bg-black text-center py-4 mt-5">

            <h5 class="text-secondary">
                Netflix Clone UI
            </h5>

            <p class="text-secondary mb-0">
                Built with Bootstrap 5
            </p>
        </footer>
    </div>
</body>
</html>
