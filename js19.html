<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS19</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
    <style>
            div{
                width: 230px;
                height: 300px;
                background: #646464;
                color: white;
                padding: 20px;
                border-radius: 20px;
                box-shadow:1px 1px 15px 0 #ff00ff;
			    margin:auto;
            }
            span{
                  color: #33ffff;
            }
            input{
                    font-size: 18px;
                    width: 160px;
                    outline: none;
            }
            button{
                    width: 150px;
                    height: 30px;
                    font-size: 20px;
                    background: #ff0000;
                    color: white;
                    border: none;
                    border-radius: 10px;
            }
            button:hover{ 
                    background: #3300ff;
            }
    </style>
</head>
<body>
        <div>
                <h2 style="text-align: center;">Simple Interest Calaculation</h2>
                <label>Principal Amount</label> <br>
                <input type="text" id="pamt" autofocus>
                <span>&#8377</span>
                <br>
                <label>Time</label> <br>
                <input type="text" id="time"> <span>Year(s)</span>
                <br>
                <label>Rate of Interest</label> <br>
                <input type="text" id="roi"> <span>%</span>
                <br><br>
                <button onclick="compute()">get interest</button>
                <br><br>
                <output id="amount"></output>
        </div>

        <script>
                function compute() 
                {
                    let p, t, r, si;
                    p = pamt.value;
                    t = time.value;
                    r = roi.value;
                    si = p*t*r/100;
                    amount.value = "Interest Amount  : "+si;
                }
        </script>
</body>
</html>
