<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays2</title>
    <link rel="icon" href="images/Instagram-Logo.jpg">
</head>
<body>
        <h3>demo on array with</h3>
        <script>
                    let a = new Array();
                    document.write(`data	:${a}<br>`);
			        document.write(`size	:${a.length}<br>`);
                    a[0]=10;
                    a[1]=30;
                    a[2]=56;
                    document.write(`data	:${a}<br>`);
			        document.write(`size	:${a.length}<br>`);

                    let b = new Array("ram", "raj", "taj")
                    document.write(`data	:${b}<br>`);
			        document.write(`size	:${b.length}<br>`);
        </script>
</body>
</html>
