<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS30</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
</head>
<body>
        <label>Table Number</label>
        <input type="text" id="tableNum"><br>
        <button onclick="printTable()">Print Table</button>

        <script>
                function printTable()
                {
                    let tn, res, i;
                    tn=tableNum.value;
                    for(i=1; i<=20; i++){
                        res=tn*i;
                        document.write(tn+"*"+i+"="+res+"<br>")
                    }
                }
        </script>
</body>
</html>
