<!--Display radio button value on check-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <script type="text/babel"">

        function displayCountry(e) {
            document.getElementById("h1Tag").innerHTML = e.target.value;
        }

        let ele = <div>
                    <input type="radio" name="country" value="India" onChange={displayCountry} />IND
                    <input type="radio" name="country" value="United State Of America" onChange={displayCountry} />USA
                    <h1 id="h1Tag"></h1>
                  </div>
        ReactDOM.render(ele, document.getElementById("divTag"))
    </script>
</body>
</html>
