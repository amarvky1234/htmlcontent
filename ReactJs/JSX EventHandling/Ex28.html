<!--Bindevent handler with arguments as values for list item genereted from 
array of objects-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <script type="text/babel"">
        let ar = [
            {
                firstname:"Praveen",
                lastname:"Gubbala",
                age:40,
                gender:'male'
            },
            {
                firstname:"Smrithi",
                lastname:"mandana",
                age:25,
                gender:'female'
            },
            {
                firstname:"mithali",
                lastname:"raj",
                age:39,
                gender:'female'
            },
            {
                firstname:"Rohit",
                lastname:"Sharma",
                age:35,
                gender:'male'
            },
            {
                firstname:"Sachin",
                lastname:"Tendulkar",
                age:50,
                gender:'male'
            }
        ];
        function display(a) {
            alert(a.firstname+" "+a.lastname+"   "+a.gender+"   "+a.age);
        }

        let ele = <div>
                    <ul>
                        {
                            ar.map((a) => {
                                return <li onClick={() => {display(a)}}>{a.firstname+" "+a.lastname}</li>
                            })
                        }
                    </ul>
                  </div>
        ReactDOM.render(ele, document.getElementById("divTag"))
    </script>
</body>
</html>
