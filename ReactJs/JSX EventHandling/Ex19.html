<!--Display result of two text box values in h1 on textbox on
multiplication and division buttons-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <script type="text/babel"">

        function mul() {
            let val1 = Number(document.getElementById("input1").value);
            let val2 = Number(document.getElementById("input2").value);

            document.getElementById("h1Tag").innerHTML = val1 * val2;
        }

        function div() {
            let val1 = Number(document.getElementById("input1").value);
            let val2 = Number(document.getElementById("input2").value);

            document.getElementById("h1Tag").innerHTML = (val1 / val2).toFixed(2);
        }

        let ele = <div>
                    <input type="text" id="input1" />
                    <br/>
                    <input type="text" id="input2" />
                    <br/><br/>
                    <button onClick={mul}>Mul</button>
                    <button onClick={div}>Div</button>
                    <h1 id="h1Tag"></h1>
                  </div>
        ReactDOM.render(ele, document.getElementById("divTag"))
    </script>
</body>
</html>
