<!--Display select box value in h1 in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="div1"></div>
    <script type="text/babel">
         function App() {
            const [value, SetValue] = React.useState("");

            function showCountry(event) {
                SetValue(event.target.value)
            }
            return (
                <div className="container mt-5">
                    <div className="card shadow p-4 w-50 mx-auto">
                        <h1 className="text-center text-primary mb-4">Select Country</h1>
                        <div className="mb-3">
                            <label className="form-label fw-bold">Choose Country</label>
                            <select className="form-select" name="country" onChange={showCountry}>
                                <option value="">--Select Country--</option>
                                <option value="IND">India</option>
                                <option value="USA">United State of America</option>
                                <option value="SRI">Srilanka</option>
                            </select>
                            <div className="alert alert-success text-center mt-3">
                                <h3>Selected Country : {value}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            )
         }
         ReactDOM.render(<App />, document.getElementById('div1'))
    </script>
</body>
</html>
