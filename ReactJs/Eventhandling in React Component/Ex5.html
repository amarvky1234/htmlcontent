<!--Display the clientX clientY position for a click on div with 300px width
and 200px height with 2px border copy in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
         const Abc = () => {

            let xyz = (ev)=> {
                console.log(ev.clientX)
                console.log(ev.clientY)
            }
            return (
                <div style={{border:'1px solid', width:"300px", height:"200px"}}>
                    <button onClick={xyz}>click here to see alret</button>
                </div>
            )
         }
         ReactDOM.render(<Abc/>, document.getElementById("div1"));
    </script>
</body>
</html>
