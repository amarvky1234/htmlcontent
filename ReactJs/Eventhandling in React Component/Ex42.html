<!--Display name in h1 id in h2 on button beside student name copy
in React Component-->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
         function StudentApp() {
            const [selectedName, setSelectedName] = React.useState("");
            const [selectedIndex, setSelectedIndex] = React.useState(null);

            const students = [
                    {
                        firstname: "Praveen",
                        lastname: "Gubbala",
                        age: 40,
                        gender: "male",
                    },
                    {
                        firstname: "Smrithi",
                        lastname: "mandana",
                        age: 25,
                        gender: "female",
                    },
                    {
                        firstname: "mithali",
                        lastname: "raj",
                        age: 39,
                        gender: "female",
                    },
                    {
                        firstname: "Rohit",
                        lastname: "Sharma",
                        age: 35,
                        gender: "male",
                    },
                    {
                        firstname: "Sachin",
                        lastname: "Tendulkar",
                        age: 50,
                        gender: "male",
                    },
                ];

                function displayNameId(stud, index) {
                    setSelectedIndex(index);
                    setSelectedName(stud.lastname)
                }

            return (
                <div>
                    <ul>
                        {
                            students.map((s, i)=>{
                                return <li key={i} onClick={() => displayNameId(s, i)}>{s.firstname}</li>
                            })
                        }
                    </ul>
                    <h1>{selectedName}</h1>
                    <h2>{selectedIndex}</h2>
                </div>
            )
         }
         ReactDOM.render(<StudentApp />, document.getElementById('div1'))
    </script>
</body>
</html>
