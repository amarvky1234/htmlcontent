<!--Display values in h1 in React Component-->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
         function App() {
            const [name, setName] = React.useState("Amar");
            const [course, setCourse] = React.useState("React JS");

            return (
                <div>
                    <h1>{name}</h1>
                    <h1>{course}</h1>

                    <button onClick={()=> setName("Kumar")}>Change Name</button>
                    <button onClick={()=> setCourse("JavaScript")}>Change Course</button>
                </div>
            )
         }
         ReactDOM.render(<App />, document.getElementById('div1'))
    </script>
</body>
</html>
