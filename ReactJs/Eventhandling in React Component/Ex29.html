<!--Implement clock in React Component-->
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
         function App() {
            const [time, SetTime] = React.useState(new Date().toLocaleTimeString());

            React.useEffect(()=> {
                const interval = setInterval(()=>{
                    SetTime(new Date().toLocaleTimeString());
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="container vh-100 d-flex justify-content-center align-items-center">
                    <div className="card shadow-lg p-5 text-center bg-black text-white rounded-4">
                        <h1 className="display-3 fw-bold text-warning">Digital Clock</h1>
                        <h1 className="display-1 mt-4">{time}</h1>
                    </div>
                </div>
            )
         }
         ReactDOM.render(<App />, document.getElementById('div1'))
    </script>
</body>
</html>
