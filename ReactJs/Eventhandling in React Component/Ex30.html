<!--Implement rating app in React Component-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div id="div1"></div>
    <script type="text/babel">
         function Rating() {
            const [rating, SetRating] = React.useState(0);

            function rate(r){
                SetRating(r);
            }

            const stars = [];
            for(let i=1; i<=5; i++){
                stars.push(
                    <span key={i} onClick={()=> rate(i)}
                        style={{fontsize:"30px", cursor: "pointer"}}
                        className="mx-1"
                    >
                        {rating >= i ? '★' : '☆'}
                    </span>
                );
            }

            return (
                <div className="container vh-100 d-flex justify-content-center align-items-center">
                    <div className="card shadow-lg p-5 text-center rounded-4">
                        <h1 className="text-success">
                            Rating: <div>{rating}/5</div>
                        </h1>
                        <div className="mb-4">
                            {stars}
                        </div>

                        <div className="progress mt-4" style={{height:"25px"}}>
                            <div className="progress-bar progress-bar-striped progress-bar-animated"
                            style={{width: `${rating * 20}%`}}
                            >
                                {rating * 20}%
                            </div>
                        </div>
                    </div>
                </div>
            )
         }
         ReactDOM.render(<Rating />, document.getElementById('div1'))
    </script>
</body>
</html>
