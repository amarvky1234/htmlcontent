<!--Bindevent handler with arguments in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
         function App() {
            const [value, SetValue] = React.useState([]);

            return (
                <div>
                    <button value="1" onClick={(e)=> {SetValue(e.target.value)}}>Button1</button>
                    <button value="Ravi" onClick={(e)=> {SetValue(e.target.value)}}>Button2</button>
                    <button value="200" onClick={(e)=> {SetValue(e.target.value)}}>Button3</button>
                    <button value="Richa" onClick={(e)=> {SetValue(e.target.value)}}>Button4</button>
                    <h1>{value}</h1>
                </div>
            )
         }
         ReactDOM.render(<App />, document.getElementById('div1'))
    </script>
</body>
</html>
