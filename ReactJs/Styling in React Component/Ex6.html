<!--Display each array object in flex boxes in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
        const Xyz = function() {
            var [students, setStudents] = React.useState([
                {
                    firstname: "Praveen",
                    lastname: "Gubbala",
                    age: 40,
                    gender: "male"
                },
                {
                    firstname: "Smrithi",
                    lastname: "mandana",
                    age: 25,
                    gender: 'female'
                },
                {
                    firstname: "mithali",
                    lastname: "raj",
                    age: 39,
                    gender: 'female'
                },
                {
                    firstname: "Rohit",
                    lastname: "Sharma",
                    age: 35,
                    gender: 'male'
                },
                {
                    firstname: "Sachin",
                    lastname: "Tendulkar",
                    age: 50,
                    gender: 'male'
                },
            ])
            return(
                <div style={{display: 'flex', flexWrap: 'wrap'}}>
                    {
                        students.map((s)=>{
                            return (
                                <div style={{width:'250px' ,border:'1px solid', margin:'10px', padding:'10px'}}>
                                    <div style={s.gender === 'male' ? {backgroundColor:'lightblue'}:{backgroundColor:'pink'}}>
                                        <h1>First Name:{s.firstname}</h1>
                                        <h1>Last Name:{s.lastname}</h1>
                                        <h1>Gender:{s.gender}</h1>
                                        <h1>Age:{s.age}</h1>
                                    </div>
                                </div>
                            )
                        })
                    }
                </div>
            )
        }
        ReactDOM.render(<Xyz></Xyz>, document.getElementById("div1"))
    </script>
</body>
</html>
