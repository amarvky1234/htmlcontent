<!--Display even array value in green and odd in red list items in
React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
        const Xyz = ()=> {
            const [x, setX] = React.useState([22, 23, 42, 34, 75, 46, 79]);
            return(
                <div>
                    <ul>
                        {
                            x.map((e)=>{
                                return <li style={e%2===0 ? {color:'green'}: {color:'blue'}}>{e}</li>
                            })
                        }
                    </ul>
                </div>
            )
        }
        ReactDOM.render(<Xyz></Xyz>, document.getElementById("div1"))
    </script>
</body>
</html>
