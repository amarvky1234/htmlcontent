<!--Display each object properties in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
        const Xyz = function() {
            let [obj, setObj] = React.useState({
                firstname: 'Amarjeet',
                lastname: 'Kumar',
                gender: 'male',
                age: 29
            })
            return(
                <div>
                    {
                        <div style={{border:'1px solid', margin:'10px', padding:'10px'}}>
                            <h1>Name:{obj.firstname}</h1>
                            <h3>Gender:{obj.gender}</h3>
                            <span>Age:{obj.age}</span>
                        </div>
                    }
                </div>
            )
        }
        ReactDOM.render(<Xyz></Xyz>, document.getElementById("div1"))
    </script>
</body>
</html>
