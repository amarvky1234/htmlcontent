<!--Display each string of array in flex boxes in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
        const Xyz = function() {
            let [ar, setAr] = React.useState(['Mango', 'Papaya', 'Banana', 'Apple'])
            return(
                <div style={{display:'flex'}}>
                    {
                        ar.map((e)=>{
                            return <div style={{border:'1px solid', margin:'10px', padding:'10px'}}>{e}</div>
                        })
                    }
                </div>
            )
        }
        ReactDOM.render(<Xyz></Xyz>, document.getElementById("div1"))
    </script>
</body>
</html>
