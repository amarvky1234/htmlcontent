<!--Display each array object in flex boxes with respective gender
images in React Component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
        const maleimage = "https://i.pinimg.com/736x/2a/4e/8d/2a4e8dab6791ed643d5180bc72167f6d.jpg";
        const femaleimage = "https://cdn.pixabay.com/photo/2014/04/02/14/10/female-306407_640.png";

        const Students = ()=> {
            var [students, setStudents] = React.useState([
                {
                    firstname: "Praveen",
                    lastname: "Gubbala",
                    age: 40,
                    gender: "male"
                },
                {
                    firstname: "Smrithi",
                    lastname: "mandana",
                    age: 25,
                    gender: 'female'
                },
                {
                    firstname: "mithali",
                    lastname: "raj",
                    age: 39,
                    gender: 'female'
                },
                {
                    firstname: "Rohit",
                    lastname: "Sharma",
                    age: 35,
                    gender: 'male'
                },
                {
                    firstname: "Sachin",
                    lastname: "Tendulkar",
                    age: 50,
                    gender: 'male'
                },
            ])
            return(
                <div style={{display: 'flex', flexWrap: 'wrap'}}>
                    {
                        students.map((s, i)=>{
                            return (
                                <div key={i} style={{width:'500px',display:'flex',border:'1px solid',alignContent:'start'}}>
                                    <div style={{width:'350px', margin:'10px', padding:'10px'}}>
                                        <div style={s.gender === 'male' ? {backgroundColor:'lightblue'}:{backgroundColor:'pink'}}>
                                            <h1>First Name:{s.firstname}</h1>
                                            <h1>Last Name:{s.lastname}</h1>
                                            <h1>Gender:{s.gender}</h1>
                                            <h1>Age:{s.age}</h1>
                                        </div>
                                    </div>
                                    <div style={{width:'150px'}}><img width="100%" src={s.gender==='male'?maleimage:femaleimage} alt="" /></div>
                                </div>
                            )
                        })
                    }
                </div>
            )
        }
        ReactDOM.render(<Students />, document.getElementById("div1"))
    </script>
</body>
</html>
