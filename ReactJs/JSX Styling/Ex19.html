<!--Display female students in pink background male in blue-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divEle"></div>
    <script type="text/babel">
        var students = [
            {
            firstname:"Praveen",
            lastname:"Gubbala",
            age:40,
            gender:"male"
            },
            {
            firstname:"Smrithi",
            lastname:"mandana",
            age:25,
            gender:'female'
            },
            {
            firstname:"mithali",
            lastname:"raj",
            age:39,
            gender:'female'
            },
            {
            firstname:"Rohit",
            lastname:"Sharma",
            age:35,
            gender:'male'
            },
            {
            firstname:"Sachin",
            lastname:"Tendulkar",
            age:50,
            gender:'male'
            },
        ]
        let ele = <table border="2">
                        {
                            students.map((s) => {
                                return(
                                    <tr style={s.gender==='female'?{backgroundColor:'pink'}:{backgroundColor:'blue'}}>
                                        <td>{s.firstname}</td>
                                        <td>{s.lastname}</td>
                                        <td>{s.gender}</td>
                                        <td>{s.age}</td>
                                    </tr>
                                )
                            })
                        }
                  </table>
        ReactDOM.render(ele, document.getElementById("divEle"));
    </script>
</body>
</html>
