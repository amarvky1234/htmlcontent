<!--Display each string of array in flex boxes-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divEle"></div>
    <script type="text/babel">
            let ar = ["Jaipur", "Patna", "Hyderabad", "Varanshi"];
            let ele = <div style={{display:'flex'}}>
                            {
                                ar.map((e) => {
                                    return <div style={{border:"1px solid", margin:"10px", padding:"10px"}}>{e}</div>;
                                })
                            }
                      </div>
            ReactDOM.render(ele, document.getElementById("divEle"))
    </script>
</body>
</html>
