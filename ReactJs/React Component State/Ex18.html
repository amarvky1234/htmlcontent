<!--Display different images conditionally React component-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="div1"></div>
    <script type="text/babel">
        let Pqr = function() {
            let a = +prompt();
            var [x, setX] = React.useState(a);
            return (
                <div>
                        {x>= 0 ? 
                            <img width="600px" src="https://cdn.pixabay.com/photo/2016/04/05/11/04/india-1309206_1280.jpg" /> 
                            : 
                            <img width="600px" src="https://cdn.pixabay.com/photo/2017/07/24/19/57/tiger-2535888_640.jpg" />}
                </div>
            )
        }
        ReactDOM.render(<Pqr></Pqr>, document.getElementById("div1"));
    </script>
</body>
</html>
