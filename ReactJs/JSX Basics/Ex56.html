<!--Likes dislikes-JSX-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display:flex;width:100%;height:100%;justify-content:center">
			<div style="align-self: center">
				<button onclick="like()">Like</button> <b id="l1"></b> &nbsp;&nbsp;&nbsp;
				<button onclick="dislike()">DisLike</button> <b id="l2"></b> &nbsp;&nbsp;&nbsp;
			</div>

		</div>
       
        <script>
            let likes = 0;
            let dislikes = 0;
            document.getElementById("l1").innerHTML = likes;
            document.getElementById("l2").innerHTML = dislikes;

            function like(){
                likes++;
                document.getElementById("l1").innerHTML = likes;
            }

            function dislike(){
                dislikes++;
                document.getElementById("l2").innerHTML = dislikes;
            }
        </script>
</body>
</html>
