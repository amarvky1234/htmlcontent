<!--Print array strings ol of uppercase strings and ul of lowercase-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <Script type="text/babel">
            var ar = ["Kholi", "Jadeja", "Pandya", "Kishan", "Samson"]
            let ele1 = <div>
                            <ol>
                                {
                                    ar.map((a) => {
                                        return <li>{a.toUpperCase()}</li>
                                    })
                                }
                            </ol>
                            <ul>
                                {
                                    ar.map((a) => {
                                        return <li>{a.toLowerCase()}</li>
                                    })
                                }
                            </ul>
                        </div>
            ReactDOM.render(ele1, document.getElementById("divTag"));
    </Script>
</body>
</html>
