<!--Generate gallery for the given array of image urls-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <Script type="text/babel">
            let images = [
               "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0kr5b5sxYqLRQuDCVEoJM4yJhAsNSWK2xVg&s",
               "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQkvjU4YPjwggKZFQ6oO9jhPWruiY8SiVmOjw&s",
               "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQNWh-EHhgJlAHJ9uUfkI-Yp2TkQi8f-uBtow&s",
               "https://png.pngtree.com/thumb_back/fh260/background/20240928/pngtree-beautiful-nature-landscape-with-mountains-image_16260967.jpg",
               "https://www.shutterstock.com/image-photo/rainbowcolored-beach-under-moonlight-colorful-600nw-2540386711.jpg",
               "https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-waterfall-free-image.jpeg?w=600&quality=80"     
            ]

            let ele1 = <div style={{border:"20px solid red", width:"600px", margin:"10px", padding:"10px"}}>
                            {
                                images.map((image)=>{
                                    return <img src={image} width="200px" height="200px" />
                                })
                            }
                       </div>  
            ReactDOM.render(ele1, document.getElementById("divTag"));
    </Script>
</body>
</html>
