<!--Print a table for the given array of students-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <Script type="text/babel">
            var students = [
                                {
                                    Firstname: "Amarjeet",
                                    Lastname: "Kumar",
                                    Age: 28,
                                    gender: "male"
                                },
                                {
                                    Firstname: "Ravi",
                                    Lastname: "Kumar",
                                    Age: 29,
                                    gender: "male"
                                },
                                {
                                    Firstname: "Reshma",
                                    Lastname: "Kumari",
                                    Age: 25,
                                    gender: "female"
                                },
                                {
                                    Firstname: "Rohit",
                                    Lastname: "Kumar",
                                    Age: 28,
                                    gender: "male"
                                }
                            ]
            
            var maleimage="https://i.pinimg.com/736x/2a/4e/8d/2a4e8dab6791ed643d5180bc72167f6d.jpg";
            var femaleimage="https://cdn.pixabay.com/photo/2014/04/02/14/10/female-306407_640.png";

            let ele1 = <table border="2">
                           {
                                students.map((s) => {
                                    return (
                                        <tr>
                                            <td>{s.Firstname}</td>
                                            <td>{s.Lastname}</td>
                                            <td>{s.Age}</td>
                                            <td>{
                                                    <img src={s.gender==='male' ? maleimage:femaleimage} width="100px" height="70px" />
                                                }
                                            </td>
                                        </tr>
                                    )
                                })
                           }
                     </table>                
            ReactDOM.render(ele1, document.getElementById("divTag"));
    </Script>
</body>
</html>
