<!--Print the images as table cells from array of image urls-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <Script type="text/babel">
            var ar = [
                        "https://cdn.pixabay.com/photo/2023/04/08/01/23/mom-7908059_1280.jpg",
                        "https://cdn.pixabay.com/photo/2015/01/07/11/31/tigers-591359_1280.jpg",
                        "https://cdn.pixabay.com/photo/2015/04/23/22/01/mountains-736886_1280.jpg",
                        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSvgX8nkatkXwVMVJDs9XoewupIWGacy-AhQ&s"
                    ]
            let ele1 = <table>
                        <tr>
                            {
                                ar.map((image) => {
                                        return <td><img src={image} width="150px" height="100px" /></td>
                                    })
                            }
                        </tr>
                     </table>    
            
            // let ele1 = <table>
            //                 {
            //                     ar.map((image) => {
            //                             return <tr><td><img src={image} width="150px" height="100px" /></td></tr>
            //                         })
            //                 }
            //          </table>
            ReactDOM.render(ele1, document.getElementById("divTag"));
    </Script>
</body>
</html>
