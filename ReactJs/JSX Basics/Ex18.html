<!-- Display different images conditionally JSX -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <Script type="text/babel">
            var a = +prompt();
            let ele1 = <div>{a>=0 ? (<img src="https://cdn.pixabay.com/photo/2017/09/25/13/12/puppy-2785074__340.jpg" />) : (<img src='https://cdn.pixabay.com/photo/2017/02/20/18/03/cat-2083492__340.jpg' />)}</div>
            ReactDOM.render(ele1, document.getElementById("divTag"));
    </Script>
</body>
</html>
