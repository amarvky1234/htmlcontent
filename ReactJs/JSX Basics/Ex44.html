<!--Print the images as list items from array of image urls-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="divTag"></div>
    <Script type="text/babel">
            var ar = [
                        "https://cdn.pixabay.com/photo/2023/04/08/01/23/mom-7908059_1280.jpg",
                        "https://cdn.pixabay.com/photo/2015/01/07/11/31/tigers-591359_1280.jpg",
                        "https://cdn.pixabay.com/photo/2015/04/23/22/01/mountains-736886_1280.jpg",
                        "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQSvgX8nkatkXwVMVJDs9XoewupIWGacy-AhQ&s"
                    ]
            let ele1 = <ol>
                        {
                            ar.map((image, index) => {
                                    return <li key={index}><img src={image} width="100px" height="50px" /></li>
                                })
                        }
                     </ol>                
            ReactDOM.render(ele1, document.getElementById("divTag"));
    </Script>
</body>
</html>
