<!-- example on Arrays -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Arrays10</title>
  </head>
  <body>
		<h3>demo on  push & pop methods</h3>		
		<script>
			const eles=[];
			eles.push(10);			//adding element to end of array
			eles.push(20);
			eles.push(30);
			document.write(`${eles}<br>`);
			let e=eles.pop()		//it poping ele from end of array
			document.write(`1st pop	${e}<br>`)
			document.write(`2nd pop	${eles.pop()}<br>`)
			eles.push(11,22,33);
			document.write(`${eles}<br>`);
		</script>
   </body>
</html>
