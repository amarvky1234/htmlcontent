<!--Create a web page to display the text using span tag, and mention the difference between div and span. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>
</head>
<body>
        <span>displaying the text using span tag</span>
        <br><br><br>
        <h3 style="color: red;">The primary difference between <b>div</b> and span is their display behavior. 
            A div is a block-level element that starts on a new line, while a span is an inline element that stays on 
            the same line as surrounding content.</h3>

            
</body>
</html>
