<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS24</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
</head>
<body>
        <h3>demo on switch</h3>
        <script>
                let n =+ prompt("enter any number");
                switch(n>=0)
                {
                    case true: document.write("positive number <br>");
                    break;
                    case false: document.write("negative number <br>")
                }

                let a = 10.56;
                switch(a)
                {
                    case 10.56: document.write("Yes <br>");
                    break;
                    default: document.write("No <br>");
                }

                let x=22, y=10, z=20;
                switch(x)
                {
                    case y: document.write("Y");
                    break;
                    case z: document.write("Z");
                    break;
                    default: document.write("Not");
                }
        </script>
</body>
</html>
