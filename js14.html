<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS14</title>
    <link rel="icon" href="images/Vanamo_Logo.png"/>
</head>
<body>
        <h3>demo on Operator Precedence</h3>
        <script>
                document.write(10-20*5+100/3, "<br>")
                document.write(10+100/3-20*5, "<br>")
                let x=10, y=17;
                document.write("Sum is "+x+y , "<br>")
                document.write("Sum is "+(x+y) , "<br>")
                document.write("Sub is "+x-y , "<br>")
                document.write(x-y+" is sub")
        </script>
</body>
</html>
