<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timers2</title>
    <link rel="icon" href="images/logo3.jpg">
</head>
<body>
            <h3>demo on digital clock & background color</h3>
            <h2 id="time" align="center"></h2>
            <h2 id="date" align="center"></h2>
            <button id="start">&nbsp; Start &nbsp; </button> &nbsp;  &nbsp; 
            <button id="stop">&nbsp; Stop&nbsp; </button>
            <script>
                //showing digital clock
                setInterval( function(){
                        let dt=new Date();
                        document.querySelector("#time").innerText=dt.toLocaleTimeString();
                    } , "1000");

                //showing date
                document.querySelector("#date").innerText=new Date().toDateString();

                let x;
                //changing color
                document.querySelector("#start").onclick=function(){
                                            x=setInterval( function(){
                                                            const c=`#`+parseInt(Math.random()*1000000);
                                                            document.body.style.backgroundColor=c;
                                                        }, "200");
                                            }
                //stoping
                document.querySelector("#stop").onclick=function(){ clearInterval(x); }
            </script>
</body>
</html>
