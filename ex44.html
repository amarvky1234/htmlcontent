<!--example on input tag-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX44</title>
    <link rel="icon" href="images/Vanamo_Logo.png">
</head>
<body>
        <div style="background: cyan; width: 600px; text-align: center;">
            <h2>Enrollment Form</h2>
            <form style="color: rebeccapurple;">
                    <label>Fullname</label><span>*</span><br>
                    <input type="text" id="fna" name="fna" required/>
                    <br><br>
                    <label>Email Id</label><span>*</span><br>
                    <input type="text" id="emid" name="emid" required>
                    <br><br>
                    <label>Contact Number</label><span>*</span><br>
                    <input type="text" name="phone" id="phone" maxlength="10" required>
                    <br><br>
                    <label>Which Course?</label><br>
                    <input type="text" name="course" id="course">
                    <br><br>
                    <label>Mode of Training</label><br>
                    <input type="text" name="mot" id="mot">
                    <br><br>
                    <button>Submit</button>
            </form>
        </div>
</body>
</html>
