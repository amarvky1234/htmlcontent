<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="icon" href="images/logo.png">

<body>
        <h3>finding sum of two number</h3>
        <form oninput="result.value=parseFloat(firstNum.value) + parseFloat(secNum.value)">
                <input type="text" id="firstNum" value="0">  &nbsp;&nbsp;
                <input type="text" id="secNum" value="0"> <br>
                <output id="result"></output>
        </form>
</body>
</html>
