<!--
internal styles
==> html tags & css code defined in the same program, but not same line
==> using <style> tag we define internal styles
==> style is paired tag and its should sub tag of <head>
Syn:		<style>
					tag{
						property:value;
						property:value;
						...
					}
					tag{
						property:value;
						property:value;
						...
					}
					........
				</style>
-->
<html lang="en">
	<head>
		<title>Ex11</title>
		<link rel="icon" href="logo2.png"/>
		<style>
			h1{
				color:blue;
			}
			img{
				width:200px;
				height:200px;
			}
		</style>
	</head>
	<body>
 		<h3>demo on  internal styles</h3>
		<h1>HTML</h1>
		<h1>CSS</h1>
		<h1>JavaScript</h1>
		 <h1>BootStrap</h1>
		<img src="images/walk.gif"/>
		<img src="images/hyd.jpg"/>
		<img src="images/tree.webp"/>
	</body>
</html>
