<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS26</title>
    <link rel="stylesheet" href="images/Instagram-Logo.jpg">
</head>
<body>
        <h3>demo on for loop</h3>
        <script>
                for(let i=1; i<=20; i++){
                    document.write(i+" ")
                }
                document.write("<br>");

                for(let i=20; i>=1; i--){
                    document.write(i+" ")
                }
        </script>
</body>
</html>
