<!--psuedo selectors(classes)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX41</title>
    <link rel="icon" href="images/logo1.avif">
    <style>
        ol li:first-child{
            color:red;
        }
        ol li:last-child{
            color: blueviolet;
        }
        ol li:nth-child(2n+2){
            color: green;
        }
    </style>
</head>
<body>
        <ol>
			<li>HTML</li>	<li>CSS</li>	<li>JavaScript</li>	<li>JQuery</li>	<li>Ajax</li>
			<li>BootStrap</li>	<li>Angular</li>	<li>React</li>	<li>NodeJS</li>
		</ol>

</body>
</html>
