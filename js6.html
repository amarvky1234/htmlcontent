<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS6</title>
</head>
<body>
        <h3>demo on variable declaration</h3>
        <script>
            var a; 
            var b = 100;
            document.write(a+"<br>")
            document.write(b+"<br>")
            document.write("<hr>")
            let c;
            let d = 200;
            document.write(c+"<br>")
            document.write(d+"<br>")
        </script>
</body>
</html>
