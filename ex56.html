<!--select & option tags-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX56</title>
    <link rel="icon" href="images/logo.png">
</head>
<body>
        <h2>demo on dropdown</h2>
        <select name="country" id="country">
            <option value="ind">India</option>
            <option value="pak">Pakistan</option>
            <option value="sri">SriLanka</option>
            <option value="ban">Bangladesh</option>
            <option value="afg">Afghanistan</option>
            <option value="ch">China</option>
            <option value="indo">Indonesia</option>
            <option value="sing">Singapore</option>
            <option value="mal">Maldives</option>
            <option value="rus">Russia</option>
            <option value="pol">Poland</option>
            <option value="ger">Germany</option>
            <option value="fra">France</option>
        </select>
        <br>
        <select name="capital" id="capital">
            <option value="new">New Delhi</option>
            <option value="is">Islamabad</option>
            <option value="col">Colombo</option>
            <option value="ka">Kabul</option>
            <option value="da">Dhaka</option>
            <option value="mos">Moscow</option>
        </select>
</body>
</html>
