<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays6</title>
    <link rel="icon" href="images/Instagram-Logo.jpg">
</head>
<body>
            <h3>demo on nested array</h3>
            <script>
                        const elements=[ [10,20,30,40,50], ["red","green","bue","cyan"] ];
                        document.write(`elements   :${elements}<br>`);

                        for(let i=0; i<elements.length; i++){
                            for(let j=0; j<elements[i].length; j++)
				                document.write(`${elements[i][j]} `);
			                    document.write(`<br>`);
                        }
            </script>
</body>
</html>
