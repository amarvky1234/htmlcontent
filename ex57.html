<!--datalist and option tags-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EX57</title>
    <link rel="icon" href="images/logo.png">
</head>
<body>
        <h2>demo on search box</h2>
        <input type="text" id="tb" name="tb" list="mylist">
        <datalist id="mylist">
            <option>Red Apple</option>
			<option>Green Apple</option>
			<option>White Apple</option>
			<option>Black Apple</option>
			<option>Yellow Mango</option>
			<option>Green Mango</option>
			<option>Red Mango</option>
			<option value="green banana">Green Banana</option>
			<option value="yellow banana">Yellow Banana</option>
			<option value="Green Grape"/>
			<option value="Black Grape"/>
        </datalist>
</body>
</html>
