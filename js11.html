    <title>JS11</title>
</head>
<body>
        <h3>demo on re-defination & hoisting</h3>
        <script>
            var a = 100;
            document.write(a+"   "+typeof a+"<br>");
            var a = "apple";
            document.write(a+"   "+typeof a+"<br>")
            //let a = true;
            var a = true;
            document.write(a+"    "+typeof a+"<br>");
            name = "ram";
            document.write(name+" "+typeof name+"<br>")
            age = 40;
            document.write(age+" years older")
            //let name, age;
            var name, age;
        </script>
</body>
