<!-- Create a webpage to display two div tags using classes.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .c1{
            background-color: blue;
            color: white;
            width: 325px;
        }
        .c2{
            background-color: red;
            color: white;
            width: 425px;
        }
    </style>
</head>
<body>
        <div class="c1">Displaying two div tag</div>
        <div class="c2">Displaying two div tag</div>
</body>
</html>
