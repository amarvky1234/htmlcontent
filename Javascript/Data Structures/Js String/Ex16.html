<!--Write a program to print all words in a string in alphabetical order.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let str = "print all words in a string in alphabetical order";

            let res = str.split(' ').sort().join(' ');
            console.log(res)
    </script>
</body>
</html>
