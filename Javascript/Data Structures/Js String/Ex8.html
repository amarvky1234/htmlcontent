<!--Write a program to convert a sample sentence string into an array of words.
Example: Input: 'Hello World' → Output: ['Hello', 'World']-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let input = 'Hello World';
            console.log(input)
            console.log(typeof input)
            
            let ar = input.split(' ');
            console.log(ar)
            console.log(typeof ar)
    </script>
</body>
</html>
