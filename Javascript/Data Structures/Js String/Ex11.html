<!--11. Write a program to print only numeric characters from a string.
Example: Input: 'Q1STR5684AK' → Output: '15684'-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let str = "1abc25deF23@iL6L!";
            
            //1st way
            let st = "";

            for (let i = 0; i < str.length; i++) {
                if(str[i] >= '0' && str[i] <= '9'){
                    st += str[i];
                }
            }
            console.log(st)
