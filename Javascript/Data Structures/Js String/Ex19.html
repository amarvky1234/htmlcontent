<!--Write a program to take a 16-digit credit card number and replace the 
first 12 digits with X.
Example: Input: '9765143265387960' → Output: 'XXXXXXXXXXXX7960'-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let input = '9765143265387960';
            
            //Using slice() and repeat()
            let Output = 'X'.repeat(12) + input.slice(12);
            console.log(Output)

            //Using substring()
            let res1 = "XXXXXXXXXXXX" + input.substring(12);
            console.log(res1)

            //Using split() and map()
            let res2 = input.split("")
                            .map(function(ch, index){
                                if(index < 12){
                                    return "X";
                                }
                                return ch;
                            }).join("");
            console.log(res2)

            //Using for loop
            let res3 = "";

            for (let i = 0; i < input.length; i++) {
                if (i < 12) {
                    res3 += "X";
                } else {
                    res3 += input[i];
                }
            }
            console.log("using for loop: "+res3);

            //Using reduce()
            let res4 = input.split("").reduce(function(acc, ch, index){
                if(index < 12){
                    return acc + "X";
                }
                return acc + ch;
            }, "");
            console.log("using reduce() :"+res4);

            //Using Array.from()
            let res5 = Array.from(input, function(ch, index) {
                return index < 12 ? "X" : ch;
            }).join("");

            console.log("Using Array.from(): "+res5);
    </script>
</body>
</html>
