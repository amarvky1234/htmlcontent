<!--Write a program to replace all vowels in a string with 8.
Example: Input: 'This is awesome' → Output: 'Th8s 8s 8w8s8m8'-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let input = "This is awesome";
            console.log(input.length)
            let str = input.replace(/[aeiou]/gi, "8");
            console.log(str)
    </script>
</body>
</html>
