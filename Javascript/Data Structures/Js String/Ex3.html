<!--Write a program to convert all characters in a string to uppercase and print the
modified string.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let str = "amarjeet"
            console.log(str)
            str = str.toUpperCase();
            console.log(str)
    </script>
</body>
</html>
