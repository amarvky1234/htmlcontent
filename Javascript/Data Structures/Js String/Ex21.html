<!-- Append the Indian calling code +91 to a given phone number.
Example: Input: '9876543210' → Output: '+919876543210'-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let input = '9876543210';

            let code = "+91";

            let Output = "+91" + input;
            console.log(Output)

            //concat()
            let res1 = code.concat(input);
            console.log("using concat() :"+res1)

    </script>
</body>
</html>
