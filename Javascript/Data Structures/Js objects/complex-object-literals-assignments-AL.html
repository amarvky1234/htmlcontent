        function promoteEmployee(empID, percentage) {
            let employeesList = company.departments.flatMap(function(dept){
                return dept.employees;
            })
            
            let employee = employeesList.filter(function(emp){
                return emp.id === empID;
            }).map(function(emp){
                emp.salary = emp.salary + (emp.salary * percentage) / 100;
                return emp;
            })
            
            if(employee.length > 0){
                return employee;
            }else {
                return "Employee not found";
            }
        }
