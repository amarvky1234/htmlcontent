<!--copyWithin() is used to copy a part of an array to another location in 
the same array.
👉 Important:
✅ It modifies (mutates) the original array
❌ It does not change the array length
❌ It does not create a new array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            //Basic Example
            // let ar = [7, 11, 5, 14, 13, 33]

            // ar.copyWithin(0, 3);
            // console.log(ar)

            //With end parameter
            // let ar = [1, 2, 3, 4, 5, 6]

            // ar.copyWithin(1, 3, 4);
            // console.log(ar)

            //Negative Index
            // let ar = [1, 2, 3, 4, 5, 6]

            // ar.copyWithin(-2, 0, 2);
            // console.log(ar)

            //Overlapping Case (Important)
            let arr = [1, 2, 3, 4, 5, 6];

            arr.copyWithin(1, 2);

            console.log(arr);
    </script>
</body>
</html>
