<!--unshift() is used to add one or more elements to the beginning (start) of
 an array.
👉 Important:
✅ Mutates (modifies) the original array
✅ Returns the new length of the array
##When you use unshift(), all existing elements are shifted one position to 
the right, and the new element is placed at index 0.
##unshift() is slower than push()
Why?
It shifts all existing elements to the right-->
