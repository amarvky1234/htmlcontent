<!--toReversed() is a modern JavaScript method (ES2023) used to reverse an 
array without modifying the original.
👉 Think of it as a safe version of reverse()-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            //Basic Example
            let ar = [12, 14, 16, 25, 145];
            let res = ar.toReversed();
            console.log(res)
            console.log(ar)
            console.log(res === ar)
    </script>
</body>
</html>
