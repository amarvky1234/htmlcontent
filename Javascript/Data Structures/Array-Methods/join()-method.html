<!--join() is used to convert an array into a string by joining all elements
with a separator.
👉 Important:
❌ Does NOT modify the original array
✅ Returns a string-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [12, 34, 44, 11, 22, -23];
            
            let x = ar.join();
            console.log(ar)
            console.log(x+"     "+typeof x)

            let y = ar.join("-");
            console.log(y+"     "+typeof y)

            let z = ar.join(" ");
            console.log(z+"     "+typeof z)
    </script>
</body>
</html>
