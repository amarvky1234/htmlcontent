<!--shift() is used to remove the first element (index 0) from an array.
👉 Important:
✅ Mutates (modifies) the original array
✅ Returns the removed element
⚠️ Shifts all remaining elements to the left-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [12, 13, 15, 17, 18];
            let removedVal = ar.shift();
            console.log(removedVal)
            console.log(ar)
    </script>
</body>
</html>
