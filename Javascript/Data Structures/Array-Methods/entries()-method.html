<!--entries() is used to get an iterator of [index, value] pairs from an 
array.
👉 It does not return an array directly — it returns an iterator object.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = ["raja", "sreeleela", "vijay", "trisha", "rama"];
            let it = ar.entries();
            console.log(it);

            for(let[index, value] of ar.entries()){
                console.log(index, value)
            }
    </script>
</body>
</html>
