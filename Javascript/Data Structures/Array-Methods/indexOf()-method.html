<!--indexOf() is used to find the index of the first occurrence of a value 
in an array.
👉 It returns:
✅ index (0, 1, 2, …) if found
❌ -1 if not found-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [21, 34, 56, 78, 23]
            // console.log(ar.indexOf(23))
            // console.log(ar.indexOf(55))
            // console.log(ar.indexOf(78))

            console.log(ar.indexOf(23, 2))
            console.log(ar.indexOf(24, -1))
            console.log(ar.indexOf(78, 4))
            console.log(ar.indexOf(78, 2))
    </script>
</body>
</html>
