<!--reverse() is used to reverse the order of elements in an array.
👉 Important:
✅ Mutates (modifies) the original array
✅ Returns the same array (reversed)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            //Basic Example
            let ar = [12, 14, 16, 25, 145];
            let res = ar.reverse();
            console.log(res)
            console.log(ar)
            console.log(res === ar)
    </script>
</body>
</html>
