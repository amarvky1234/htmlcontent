<!--Print the greatest of all 2-digit numbers in an array.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [5, 23, 150, 67, 9, 88, -45, 102];

            //Using filter + Math.max
            let result = Math.max(
                ...ar.filter(num => Math.abs(num) >= 10 && Math.abs(num) <= 99)
            );
            console.log(result);

            //Using loop
            let max2Digit = 0;
            for(var i=0; i<=ar.length-1; i++){
                if(Math.abs(ar[i]) >= 10 && Math.abs(ar[i]) <= 99){
                    if(ar[i] > max2Digit){
                        max2Digit = ar[i]
                    }
                }
            }
            console.log("max2Digit: "+max2Digit)
    </script>
</body>
</html>
