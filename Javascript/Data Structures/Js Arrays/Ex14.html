<!--Sum all elements in an array.
o Input: [23, 34, 54, 10, 4, 7] → Output: 132-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
                let ar =  [23, 34, 54, 10, 4, 7]
                let sum = 0;
                    
                // for(var i=0; i < ar.length; i++) {
                //    sum += ar[i]      
                // }
                // console.log("sum: "+sum)

                let sumEle = ar.reduce(function(prev, curr){
                    return prev + curr;
                })
                console.log(sumEle);

                ar.forEach(function(ele){
                    sum += ele
                })
                console.log(sum)
    </script>
</body>
</html>
