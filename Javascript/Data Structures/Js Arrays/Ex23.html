<!--Print all odd numbers in an array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [12, 34, 11, 45, 10, 47]

            for(var i=0 ; i<=ar.length-1; i++){
                if(ar[i] % 2 != 0){
                    console.log(ar[i])
                }
            }

            let oddAr = ar.filter(function(ele){
                return ele % 2 !== 0;
            })
            console.log(oddAr)
    </script>
</body>
</html>
