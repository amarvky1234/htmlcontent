<!-- Print all positive numbers in an array.-->
 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [12, -34, -11, -45, 10, 47]

            for(var i=0 ; i<=ar.length-1; i++){
                if(ar[i] > 0){
                    console.log(ar[i])
                }
            }

            let positiveNum = ar.filter(function(ele){
                return ele > 0 ;
            })
            console.log(positiveNum)
    </script>
</body>
</html>
