<!--Count the frequency of each element in an array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [1, 2, 3, 2, 4, 1, 5];

            let freq = ar.reduce(function(acc, curr){
                console.log(acc)
                acc[curr] = (acc[curr] || 0) + 1
                console.log(acc)
                return acc
            }, {}) 
            console.log(freq)
    </script>
</body>
</html>
