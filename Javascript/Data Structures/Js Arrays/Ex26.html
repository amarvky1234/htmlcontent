<!--Print only multiples of 5 from an array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [13, 102, 5, -25, 93, 2, 105, 9]

            for(var i=0 ; i<=ar.length-1; i++){
                if(ar[i] % 5 === 0){
                    console.log(ar[i])
                }
            }
    </script>
</body>
</html>
