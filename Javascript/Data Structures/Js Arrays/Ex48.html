<!--Print all negative elements in an array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [1, -1, 2, -2, 34, -34, 0, 7, -11, 8, -9]
            console.log(ar)

            for(var i=0; i<=ar.length-1; i++){
                if(ar[i] < 0){
                    console.log(ar[i])
                }
            }
    </script>
</body>
</html>
