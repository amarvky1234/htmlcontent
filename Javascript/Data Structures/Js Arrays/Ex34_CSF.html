<!--Print odd numbers divisible by 3.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [1, 3, 41, -15, 105, 60, 21, 12, 18]

            for (let i = 0; i <=ar.length-1; i++) {
                if(ar[i] % 2 !== 0 && ar[i] % 3 === 0){
                    console.log(ar[i])
                }
            }
    </script>
</body> 
</html>
