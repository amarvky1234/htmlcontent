<!--Store only even numbers of an array into another array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [11, 12, 13, 14, 15, 16]
            let br = []

            for(var i=0; i<=ar.length-1; i++){
                if(ar[i] % 2 === 0){
                     br.push(ar[i])
                }
            }
            console.log(ar)
            console.log(br)
    </script>
</body>
</html>
