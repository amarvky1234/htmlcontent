<!--Insert the first 10 odd numbers into an empty array-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = []
            let k = 1;

            for (let i = 0; i <10; i++) {
               ar[i] = k
               k += 2
            }
            console.log(ar)
    </script>
</body>
</html>
