<!--Print only odd numbers from an array.
o Input: [23, 34, 54, 10, 4, 7] → Output: 23 7 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar =  [23, 34, 54, 10, 4, 7]
            
            // for(var i=0; i < ar.length; i++) {
            //     if(ar[i] % 2 != 0){
            //         console.log(ar[i])
            //         document.write(ar[i]+"  ")
            //     }    
            // }

            let oddAr = ar.filter(function(ele){
                if(ele % 2 !== 0){
                    return true;
                }
            })
            console.log(oddAr);
    </script>
</body>
</html>
