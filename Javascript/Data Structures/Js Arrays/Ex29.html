<!--Increment salaries by 5% in a given array.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [25000, 32000, 41500, 35000, 78500]
            console.log(ar)

            for(var i=0 ; i<=ar.length-1; i++){
                ar[i] = ar[i] + (ar[i] * 0.05)
            }
            console.log(ar)
    </script>
</body>
</html>
