<!--Find the total number of times an element appears in an array.
o Input: [23, 34, 54, 10, 34, 7, 23], Query: 34 → Output: 2 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
                let ar = [23, 34, 54, 10, 34, 7, 23]
                let count = 0;
                    
                for(var i=0; i < ar.length; i++) {
                   if(ar[i] == 34){
                        count++
                   }     
                }
                console.log("total number of times an element appears in an array: "+count)

                let countEle = ar.filter(function(ele){
                    if(ele === 34){
                        return true;
                    }
                }).length
                console.log(countEle)
    </script>
</body>
</html>
