<!--Sort elements in ascending/descending order.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ar = [34, 192, 0, 11, -45, 76]
            console.log(ar)

            let aoAr = ar.sort((a, b) => a-b)
            console.log(aoAr)

            let doAr = ar.sort((a, b) => b-a)
            console.log(doAr)
    </script>
</body>
</html>
