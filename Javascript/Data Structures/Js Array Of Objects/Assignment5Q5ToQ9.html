5. Average Salary:
Write a function that calculates and returns the average salary of all 
employees in the company.

6. Update Employee Status:
Write a function that takes an employee ID and a new status ("active" or 
"inactive") as parameters and updates the employee's status.If the employee 
doesn't exist, return "Employee not found".

7. Remove Employee by ID:
Write a function that removes an employee from the array based on their ID.
If the employee doesn’t exist, return "Employee not found".

8. Employees with Salary Above a Threshold:

            //5.
            function averageSalaryOfAllEmployees() {
                let avgSal = employees.reduce(function(sum, emp){
                        return sum += emp.salary
                }, 0) / employees.length

                return avgSal.toFixed(2);
            }
            console.log(averageSalaryOfAllEmployees())
            
            //6.
            function updatedEmployeeStatus(empId, newStatus) {
                let empAr = employees.filter(function(emp){
                    return emp.id === empId;
                }).map(function(emp){
                    emp.status = newStatus;
                    return emp;
                })

                if(empAr.length !== 0){
                    return empAr;
                }else {
                    return "Employee not found";
                }
            }
            console.log(updatedEmployeeStatus(2, "active"))

            function employeesWithMoreThanSalary(sal) {
                let empAr = employees.filter(function(emp){
                    return emp.salary > sal;
                })
                
                if(empAr.length > 0) {
                    return empAr;
                }else {
                    return "No Employee Salary is more than given Salary";
                }
            }
            console.log(employeesWithMoreThanSalary(78000));
            console.log(employeesWithMoreThanSalary(59000));

            //9.
            function sortEmployeesBySalary() {
                employees.sort(function(a, b){
                    return b.salary - a.salary;
                })
                return employees;
            }
