<!--6. Filter Students by Age: Write a function that filters students who are older 
than a specified age. For example, filter out all students over the age of 20.
 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            const students = [
                { name: "John", age: 18 },
                { name: "Emily", age: 20 },
                { name: "Michael", age: 22 },
                { name: "Sarah", age: 19 }
            ];

            //1.
            function getStudentByAge() {

                let student = students.filter(function(s) {
                    return s.age > 20;
                });

                return student;
            }

            console.log(getStudentByAge())
    </script>
</body>
</html>
