10. Department-wise Salary Calculation:
Write a function that calculates the total salary expense for each department.
The result should be an object where the keys are department names, and the 
values are the total salaries for each department.

11. Employee with the Highest Salary:
Write a function that returns the employee who has the highest salary, along 
with their name, department, and salary.

12. Average Salary by Department:
Write a function that calculates and returns the average salary of employees 
in each department.The result should be an object where the keys are 
department names, and the values are the average salary for each department.

13. Inactive Employees Count:
Write a function that returns the number of employees who have an "inactive" 
status.

14. Update Salary Based on Department:
Write a function that increases the salary of all employees in a specific 
department by a certain percentage. The function should take the department 
name and percentage increase as parameters.

15. Promote Employees (Based on Salary):
Write a function that promotes employees who have a salary above a certain 
threshold (e.g., $60,000) by giving them a $10,000 raise.
Return the updated list of employees with the new salary.

16. Employee Report:
Write a function that returns a report of all employees in the following 
format:
Name: [name], Department: [department], Salary: [salary], Status: [status].
The report should be sorted alphabetically by employee name.-->
