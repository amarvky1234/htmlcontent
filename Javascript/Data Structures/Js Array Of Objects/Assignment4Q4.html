<!--4. Add a New Student: Write a function that adds a new student to the array. 
The function should take the student's name and age as parameters.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            const students = [
                { name: "John", age: 18 },
                { name: "Emily", age: 20 },
                { name: "Michael", age: 22 },
                { name: "Sarah", age: 19 }
            ];

            
            function addStudent(name, age) {
                students.push({
                    name: name,
                    age: age
                });
            }

            addStudent("Smith", 23)
            console.log(students)
    </script>
</body>
</html>
