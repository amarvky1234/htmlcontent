<!-- 10. declare a variable with string literal.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            var s1 = "Hi";
            document.write(s1+"<br>");
            console.log(s1)

            let s2 = 'Amarjeet';
            document.write(s2+"<br>");
            console.log(s2)

            const s3 = "Welcome!"
            document.write(s3)
            console.log(s3);
    </script>
</body>
</html>
