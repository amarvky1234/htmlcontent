<!--In a town, the percentage of men is 52. The percentage of total literacy is 48.
 If total percentage of literate men is 35 of the total population, write a 
 program to find the total number 48 Let Us C of illiterate men and women if the 
 population of the town is 80,000.-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
            let men = (80000 * 52) / 100;
            console.log("men: "+men)

            let women = 80000 - men;
            console.log("women: "+women)

            let totalLiteracy = (80000 * 48) / 100;
            console.log("totalLiteracy: "+totalLiteracy)

            let literateMen = (80000 * 35) / 100;
            console.log("literateMen: "+literateMen)

            let illiterateMen = men - literateMen;
            console.log("illiterateMen: "+illiterateMen)

            let literateWomen = totalLiteracy - literateMen;
            console.log("literateWomen: "+literateWomen)

            let illiteratewomen = women - literateWomen;
            console.log("illiteratewomen: "+illiteratewomen)

            document.write("illiterateMen: "+illiterateMen)
            document.write("<br>")
            document.write("illiteratewomen: "+illiteratewomen)
    </script>
 </body>
 </html>
