<!--Write a program to print the simple interest rate of given P T R values-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let p = Number(prompt("enter principal"))
            let t = Number(prompt("enter time"))
            let r = Number(prompt("enter rate"))

            let si = (p * t * r) / 100;
            document.write(si)
            console.log(si)
            console.log(r)
    </script>
</body>
</html>
