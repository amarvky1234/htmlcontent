<!--Find the area of a rectangle for given length and breadth-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let l = +prompt("enter length")
            let b = +prompt("enter breadth")
            console.log(l+"      "+b)

            let area = l * b ;
            document.write(area+"cm")
            console.log(area)
    </script>
</body>
</html>
