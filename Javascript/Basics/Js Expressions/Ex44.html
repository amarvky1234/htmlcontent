<!--If a four-digit number is input through the keyboard, write a program to 
obtain the sum of the first and last digit of this number. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt("enter four digit number");
            console.log(num)

            let lastDigit = num % 10;
            console.log(lastDigit)

            let firstDigit = Math.floor(num / 1000);
            console.log(firstDigit)

            let sum = firstDigit + lastDigit;
            document.write(sum)
            console.log("sum: "+sum)
    </script>
</body>
</html>
