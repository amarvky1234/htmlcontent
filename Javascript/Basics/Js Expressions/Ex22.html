<!--Write a program to print the reminder of a division-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let x = Number(prompt("Enter a dividend"))
            let y = Number(prompt("Enter a divisor"))
            let rem = x % y
            document.write(rem)
            console.log(rem)
    </script>
</body>
</html>
