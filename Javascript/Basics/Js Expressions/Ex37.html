<!--The distance between two cities (in km.) is input through the keyboard. Write a 
program to convert and print this distance in meters, feet, inches and centimeters. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let d = +prompt();

            document.write(d*1000+"m <br>")
            document.write(d*3281+"feet <br>")
            document.write(d*39370+"inches <br>")
            document.write(d*100000+"cm")
            console.log(d*1000+"m")
            console.log(d*3281+"feet")
            console.log(d*39370+"inches")
            console.log(d*100000+"cm")

    </script>
</body>
</html>
