<!--Find the area of a square for given length of a side-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let side = +prompt("enter length of side")
        console.log(side)

        let area = side * side;
        document.write(area+"cm<sup>2")
        console.log(area)
    </script>
</body>
</html>
