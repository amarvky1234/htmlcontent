<!--Print two given numbers in descending order.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num1 = +prompt();
            let num2 = +prompt();
            console.log(num1+"     "+num2)

            if (num1 > num2) {
                console.log("descending order: "+num1+","+num2)
                document.write("descending order: "+num1+","+num2)
            }
            else {
                console.log("descending order: "+num2+","+num1)
                document.write("descending order: "+num2+","+num1)
            }
    </script>
</body>
</html>
