<!--Check if a number is a factor of 96. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt("enter a number")

            if(96 % num == 0) {
                console.log(num+"  is factor of 96")
                document.write(num+"  is factor of 96")
            }   
            else {
                console.log(num+"  is not factor of 96")
                document.write(num+"  is not factor of 96")
            }
    </script>
</body>
</html>
