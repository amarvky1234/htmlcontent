<!--Accumulation (Summation & Products):
Sum of 1 to 10
Average of 1 to 10
Product of numbers between 1 to 10-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let i =1 

            let sum = 0;
            let product = 1;

            while(i <= 10){
                sum += i
                product *= i;
                i++
            }
            console.log("Sum of 1 to 10:  "+sum)
            console.log("Average of 1 to 10: "+ (sum / 10))
            console.log("Product of numbers between 1 to 10: "+product)
    </script>
</body>
</html>
