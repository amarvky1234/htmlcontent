<!--Write a Javascript program to print all the even numbers which are divisible by 3 up to a given number.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();

            if(num > 0) {
                let i = 1;

                while(i <= num) {
                    if(i % 2 == 0 && i % 3 == 0){
                        console.log(i)
                    }
                    i++
                }
            }else{
                let i = num;

                while(i != 0) {
                    if(i % 2 == 0 && i % 3 == 0){
                        console.log(i)
                    }
                    i++
                }
            }
    </script>
</body>
</html>
