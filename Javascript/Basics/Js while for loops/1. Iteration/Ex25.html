<!--Write a Javascript Program to print all the even numbers up to a given number in the descending order.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            var num = +prompt();

            let i = num;

            while(i > 0) {
                if(i % 2 == 0){
                    console.log(i)
                }
                i--
            }
    </script>
</body>
</html>
