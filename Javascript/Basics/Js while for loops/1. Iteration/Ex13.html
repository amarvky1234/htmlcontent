<!-- Write a program to print first ten multiples of 4 using a while loop 
 (multiples of 4 are 4,8,12,16,20,...)-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
            let i = 1;

            while(i <= 10) {
                console.log(4*i)
                i++
            }
    </script>
 </body>
 </html>
