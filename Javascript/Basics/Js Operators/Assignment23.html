<!--23. Find the perimeter of a rectangle of length 50cm and breadth 35cm. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            let l = Number(prompt("enter the length"));
            let b = Number(prompt("enter the breadth"));
            let perimeter = 2*(l + b);

            document.write(perimeter+"cm")
            console.log(perimeter+"cm")
     </script>
</body>
</html>
