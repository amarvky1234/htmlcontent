<!--11. Write a program to print the least number in given two numbers -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            let x = Number(prompt("enter a number"));
            let y = Number(prompt("enter a number"));
            console.log(x+"   "+y);

           if(x < y) document.write(x+"  is least number")
           else document.write(y+"  is least number")
     </script>
</body>
</html>
