<!--6. Write a program to check a number is positive or not. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            var x =  Number(prompt("enter a number"))
            
            if(x > 0) document.write("number is positive");
            else if(x == 0) document.write("number is neither positive nor negative");
            else document.write("number is negative");
     </script>
</body>
</html>
