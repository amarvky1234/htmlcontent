<!--4. Write a program to check a number is factor of 84 or not -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            var x =  Number(prompt("enter a number"))
            
            if(84 % x == 0) document.write(x+ "  is factor of 84");
            else document.write(x+ "  is not factor of 84")
     </script>
</body>
</html>
