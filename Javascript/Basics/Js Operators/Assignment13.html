<!--13. Write a program to print the given two numbers in descending order -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            let x = Number(prompt("enter a number"));
            let y = Number(prompt("enter a number"));
            console.log(x+"   "+y);

           if(x > y) document.write("Descending order : "+x+", "+y)
           else document.write("Descending order : "+y+", "+x)
     </script>
</body>
</html>
