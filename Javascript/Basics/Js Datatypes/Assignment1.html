<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            var int = 678;
            document.write(int+"<br>")

            var n = 0o17;
            document.write(n+"<br>");

            let hexaDeciNo = 0x1A2B;
            document.write(hexaDeciNo+"<br>")

            //var a = true;
            let a = false;
            document.write(a+"<br>")

            const weekDay = 'Sunday'
            document.write(weekDay+"<br>")
            console.log(weekDay)

            var val = 'undefined value';
            document.write(val+"<br>")
            console.log(val)

            let p = null;
            document.write(p+"<br>")
            console.log(p);

            let nan = NaN;
            document.write(nan+"<br>")
            console.log(nan)

            let arr = [];
            document.write(arr+"<br>")
            console.log(arr)

            let obj = new Object('ram');
            document.write(obj);
            console.log(obj)
           
    </script>
</body>
</html>
