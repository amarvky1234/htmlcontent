<!--27. Find the area of a circle of radius 3.75cm. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            let r = Number(prompt("enter the radius"));
            let area = 3.14 * r * r;

            document.write(area+"cm")
            console.log(area+"cm")
     </script>
</body>
</html>
