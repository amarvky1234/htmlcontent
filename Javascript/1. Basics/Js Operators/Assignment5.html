<!--5. Write a program to check a number is multiple of 3 or not -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
            var x =  Number(prompt("enter a number"))
            
            if(x % 3 == 0) document.write(x+ "  is multiple of 3");
            else document.write(x+ "  is not multiple of 3")
     </script>
</body>
</html>
