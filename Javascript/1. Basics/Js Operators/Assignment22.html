<!--22. Find the perimeter of a square having each side 4cm. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
           let side = Number(prompt("enter the side"));
           let perimeter = 4*side;
           document.write(perimeter+"cm")
           console.log(perimeter+"cm")
     </script>
</body>
</html>
