<!--Write a program to print the number at 100's place-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();
            console.log(num)
            
            let tensPlace = 0;
            let i = 1;

            while(i <= 3) {
                tensPlace = num % 10;
                num = Math.floor(num / 10)
                i++;
            }
            console.log(tensPlace)
    </script>
</body>
</html>
