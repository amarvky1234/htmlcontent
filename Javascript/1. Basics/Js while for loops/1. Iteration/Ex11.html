<!--Write a program to print 1 to 10 even numbers using a while loop-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = 1;

            while(num != 11){
                if(num % 2 == 0) {
                    console.log(num)
                }
                num++;
            }
    </script>
</body>
</html>
