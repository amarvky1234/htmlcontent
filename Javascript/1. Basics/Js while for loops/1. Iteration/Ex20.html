<!--a program to read 5 numbers and print the maximum and minimum number-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let max = 0;
            let min = 0;

            var i = 1;

            while(i <= 5){
                let num = +prompt();
                console.log(num+" ")
                if(num > max){
                    max = num;
                }
                if(num < min){
                    min = num
                }
                i++;
            }

            console.log("Max: "+max)
            console.log("Min: "+min)
    </script>
</body>
</html>
