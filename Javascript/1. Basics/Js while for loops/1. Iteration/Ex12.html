<!--Write a program to print 1 to 10 odd numbers using a while loop-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            var n = 1;

            while(n <= 10){
                if(n % 2 != 0) console.log(n)
                n++
            }
    </script>
</body>
</html>
