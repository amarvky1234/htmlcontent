<!--Write a program to print 1 to 10 numbers using a for loop-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            document.write("for loop")
            for(let i =1; i<=10; i++){
                console.log(i)
            }
    </script>
</body>
</html>
