<!--Write a Javascript Program to print first ten multiples of a given number in the descending order.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();

            var i = 10;

            while (i > 0) {
                console.log(num * i)
                i--
            }
    </script>
</body>
</html>
