<!--Write a program to print all the factors of a given number-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();

            var i = 1;
            console.log("factor of "+num+" are")
            
            while(i <= num) {
                
                if(num % i == 0){
                    console.log(i)
                }
                i++;
            }
    </script>
</body>
