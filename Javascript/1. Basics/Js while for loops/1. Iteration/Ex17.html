<!--Write a program to print first 10 multiples of 3 using a for loop-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            for(var i = 1; i <= 10; i++){
                console.log(3*i)
            }
    </script>
</body>
</html>
