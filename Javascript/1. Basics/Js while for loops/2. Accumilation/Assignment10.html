<!--Number
Properties:
Check if a number is prime-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();
            console.log("num: "+num)

            let count = 0;
            let i = 1;

            while(i <= num){
                if(num % i == 0) {
                    count++
                }
                i++;
            }
            
            if(count == 2){
                console.log(num+" prime number")
            }else {
                console.log(num+" not a prime number")
            }
    </script>
</body>
</html>
