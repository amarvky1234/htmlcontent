<!--Check if a character is an alphabet or not.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let ch = prompt();
            console.log(ch)

            if(ch.length === 1){
                if(ch >= 'a' && ch <= 'z' || ch >= 'A' && ch <= 'Z'){
                    console.log("character is an alphabet")
                }else {
                    console.log("character is not an alphabet")
                }
            }else{
               console.log("enter only one character") 
            }
    </script>
</body>
</html>
