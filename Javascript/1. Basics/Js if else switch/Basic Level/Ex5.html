<!--Find the greatest number among three numbers.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num1 = +prompt();
            let num2 = +prompt();
            let num3 = +prompt();
            console.log(num1+"     "+num2+"      "+num3)

            if (num1 > num2 && num1 > num3) {
                console.log(num1 +"  greatest number among three numbers.")
                document.write(num1 +"  greatest number among three numbers.")
            }
            else if(num2 > num1 && num2 > num3){
                console.log(num2 +"  greatest number among three numbers.")
                document.write(num2 +"  greatest number among three numbers.")
            }
            else {
                console.log(num3 +"  greatest number among three numbers.")
                document.write(num3 +"  greatest number among three numbers.")
            }
    </script>
</body>
</html>
