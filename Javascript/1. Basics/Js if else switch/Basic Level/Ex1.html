<!--Find the greatest number among two numbers.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num1 = +prompt();
            let num2 = +prompt();
            console.log(num1+"     "+num2)

            if (num1 > num2) {
                console.log(num1 +"  greatest number among two numbers.")
                document.write(num1 +"  greatest number among two numbers.")
            }
            else {
                console.log(num2 +"  greatest number among two numbers.")
                document.write(num2 +"  greatest number among two numbers.")
            }
    </script>
</body>
</html>
