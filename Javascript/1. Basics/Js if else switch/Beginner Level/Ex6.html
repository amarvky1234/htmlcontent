<!--Check if a number has 4 at the unit's place.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt("enter a number")

            if(num % 10 == 4) {
                console.log(num+"  number has 4 at the unit's place")
                document.write(num+"  number has 4 at the unit's place")
            }   
            else {
                console.log(num+"  number has not 4 at the unit's place")
                document.write(num+"  number has not 4 at the unit's place")
            }
    </script>
</body>
</html>
