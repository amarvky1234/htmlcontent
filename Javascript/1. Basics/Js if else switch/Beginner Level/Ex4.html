<!--Check if a number is a multiple of 3. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt("enter a number")

            if(num % 3 == 0) {
                console.log(num+"  multiple by 3")
                document.write(num+"  multiple by 3")
            }   
            else {
                console.log(num+"  is not multiple by 3")
                document.write(num+"  is not multiple by 3")
            }
    </script>
</body>
</html>
