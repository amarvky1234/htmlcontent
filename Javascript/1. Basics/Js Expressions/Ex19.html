<!--Write a script to swap two numbers-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            var n1 = 23;
            var n2 = 32;

            var n3 = n1;
            n1 = n2;
            n2 = n3;

            document.write(n1+"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"+n2);
            console.log(n1+"     "+n2);
    </script>
</body>
</html>
