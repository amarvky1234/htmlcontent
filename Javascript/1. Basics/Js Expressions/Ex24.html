<!--Write a program to print the max of given two numbers using ternary operator-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let x = Number(prompt("enter first number"))
            let y = Number(prompt("enter second number"))

            let max = (x > y) ? x : y;
            document.write(max)
            console.log(max)
    </script>
</body>
</html>
