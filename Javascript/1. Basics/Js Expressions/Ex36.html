<!-- Ramesh’s basic salary is input through the keyboard. His dearness allowance is 
 40% of basic salary, and house rent allowance is 20% of basic salary. Write a program 
 to calculate his gross salary.-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <script>
            let salary = +prompt("enter salary");
            console.log(salary)

            let grossSal = salary + (salary * 0.4) + (salary * 0.2);
            document.write(grossSal)
            console.log(grossSal)
    </script>
 </body>
 </html>
