<!--Check a given number is odd or not using ternary operator-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();
            console.log(num)

            // let str = num % 2 != 0 ? "Odd" : "Even";
            // document.write(str)
            // console.log(str)

            if(num % 2 != 0) {
                document.write("Odd")
                console.log("Odd")
            }else {
                document.write("Even")
                console.log("Even")
            }
    </script>
</body>
</html>
