<!--Check a given number is multiple of 4 or not using ternary operator-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            let num = +prompt();

            if (num % 4 == 0) {
                document.write(num+" Multiple of 4")
                console.log(num+" Multiple of 4")
            } else {
                document.write(num+" not Multiple of 4")
                console.log(num+" not Multiple of 4")
            }
    </script>
</body>
</html>
