<body>
    <script>
            let a = 23.0007;
            let b = 32.5;

            //using Addition & Subtraction
            // a = a + b;
            // b = a - b; 
            // a = a - b;

            //using Multiplication & Division
            a = a * b;
            b = a / b;
            a = a / b;

            //using XOR (Bitwise Operator)
            // a = a ^ b;
            // b = a ^ b;
            // a = a ^ b;

            //using Destructing
            // [a, b] = [b, a]

            console.log("a =", a, "b =", b);
    </script>
