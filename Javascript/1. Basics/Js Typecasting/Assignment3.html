<!--3. Convert a number 100 into a string.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            //Using toString()
            let x1 = 100;
            let s = x1.toString();
            document.write(s);
            console.log(s);
            document.write("<br>")

            //Using String()
            let x2 = 100;
            let str = String(x2);
            document.write(str);
            console.log(str);
            document.write("<br>")

            let i=String(100)
            document.write(i+"<br>")
            document.write(i+12)

            //Using Concatenation (+ "")
            let x3 = 100;
            let st = x3 + "";
           // document.write(st);
            console.log(st);

    </script>
</body>
</html>
