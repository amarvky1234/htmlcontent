<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello World</h1>
    <script>
            let header = document.querySelector("h1")
           
            //a.Print the text inside the h1 element in the console.
            console.log(header.innerText);

            //b.Print the data type of the text inside the h1.
            console.log(typeof header.innerText)

            //c.Print the text inside the h1 in uppercase in the console.
            console.log(header.innerText.toUpperCase());

            //d.Change the text of the h1 to "Welcome to Edupoly".
            header.innerText = "Welcome to Eduploy";
            header.style.color = "blue";


    </script>
</body>
</html>
