<!DOCTYPE html>
<html lang="en">

    <link rel="icon" href="images/logo3.jpg">
</head>
<body>
        <h3>demo on if else</h3>
        <script>
                //checking even or odd 
                let n =+ prompt("enter a number");
                if(n%2===0){
                        document.write(n+ " is a even number")
                }else{
                        document.write(n+ " is a odd number")
                }
        </script>
</body>
</html>
