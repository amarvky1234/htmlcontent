<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebPage</title>
    <style>
        .container1,ul{
                background-color: cyan;
                display: flex;
                justify-content: space-between;
                padding-left: 5%;
                padding-right: 5%;
                gap: 2em;
        }
        .menu a{
            text-decoration: none;
        }
        
        .container1 ul{
            list-style: none;
        }
        .container1 ul li{
            text-decoration: none;
        }

        .container1 img{
                width: 8em;
                height: 3em;
        }
        .btn{
           background-color: #00a86b;
           color: white;
           border: none;
           padding: 1em 1.5em;
           border-radius: 0.5em;
           cursor: pointer;
        }
        img{
            width: 30em;
            height: 35em;
            align-self: self-end;
        }
    </style>
</head>
<body>
        <div class="container1">
            <div>
                <img src="images/edupoly.png"/>
            </div>
            <div class="menu">
                <ul>
                    <li style="text-decoration: none;"><a href="">Courses</a></li>
                    <li><a href="">Tutorial</a></li>
                    <li><a href="">Notes</a></li>
                    <li><a href="">Training</a></li>
                    <li><button class="btn">Register</button></li>
                </ul>
            </div>
        </div>
        <img src="images/edupoly-training.png">
</body>
</html>
