<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays5</title>
    <link rel="icon" href="images/Instagram-Logo.jpg">
</head>
<body>
        <h3>demo on nested array</h3>
        <script>
           const elements = [ [10,20,30], [11,22,33] ];
           document.write(`elements    :${elements} <br>`);
           document.write(`${elements.length} <br>`);
           document.write(`${elements[0]} <br>`);
           document .write(`${elements[1]} <br>`);

           for(let i=0; i<elements.length; i++){
                for(let j=0; j<elements[i].length; j++){
                    document.write(`${elements[i][j]}`);
                }
                document.write(`<br>`);
           }
        </script>
</body>
</html>
