    <link rel="icon" href="images/ipllogo.jpg">
	<link

    <style>

		.table-card{
            background-color: white;
            border-radius: 20px;
            overflow: hidden;
        }

		.table thead{
            background: linear-gradient(to right, #ff512f, #dd2476);
            color: white;
        }

		.team-logo{

            height: 28px;
            object-fit: contain;
        }

        tbody tr:hover{
            background-color: #f1f5f9;
            transition: 0.3s;
            cursor: pointer;
        }

		.top-team{
            background-color: #dcfce7 !important;
            font-weight: bold;
        }

        .title{
            color: white;
            font-weight: bold;
            letter-spacing: 1px;

</head>
