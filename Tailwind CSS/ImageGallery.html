<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <section class="max-w-7xl mx-auto">
        <div class="text-center">
            <h1 class="text-4xl font-bold">
                Photo Gallery
            </h1>
            <p class="text-gray-500 mt-3">
                Explore our collection
            </p>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 mt-12">

            <div class="h-64 bg-blue-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🌊
            </div>
            <div class="h-64 bg-green-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🌳
            </div>
            <div class="h-64 bg-yellow-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🌅
            </div>
            <div class="h-64 bg-purple-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🏔️
            </div>
            <div class="h-64 bg-pink-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🌸
            </div>
            <div class="h-64 bg-cyan-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🏖️
            </div>
            <div class="h-64 bg-orange-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🌋
            </div>
            <div class="h-64 bg-indigo-400 rounded-xl flex items-center
                justify-center text-7xl hover:scale-105 transition">
                🌌
            </div>
        </div>
    </section>
</body>
</html>
