<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white">

    <div class="flex min-h-screen"> 
        <aside class="w-64 bg-gray-900 p-6 hidden md:block">
            <h1 class="text-2xl font-bold text-green-400">
                DevPanel
            </h1>

            <div class="space-y-4 mt-10 text-gray-300">
                <p>Dashboard</p>
                <p>Projects</p>
                <p>Repositories</p>
                <p>Deployments</p>
                <p>API Keys</p>
            </div>
        </aside>

        <main class="flex-1 p-6">
            <h2 class="text-3xl font-bold">Developer Dashboard</h2>

            <div class="grid md:grid-cols-3 gap-6 mt-8">
                <div class="bg-gray-900 p-6 rounded-xl">
                    <p class="text-gray-400">Repositories</p>
                    <h3 class="text-4xl font-bold mt-3">24</h3>
                </div>
                <div class="bg-gray-900 p-6 rounded-xl">
                    <p class="text-gray-400">Deployments</p>
                    <h3 class="text-4xl font-bold mt-3">128</h3>
                </div>
                <div class="bg-gray-900 p-6 rounded-xl">
                    <p class="text-gray-400">API Requests</p>
                    <h3 class="text-4xl font-bold mt-3">1.2M</h3>
                </div>
            </div>

            <div class="bg-gray-900 p-6 rounded-xl mt-8">
                <h3 class="text-xl font-bold">Recent Projects</h3>

                <div class="space-y-4 mt-5">
                    <div class="border border-gray-700 p-4 rounded-lg flex justify-between">
                        <span>Healthcare API</span>
                        <span class="text-green-400">Deployed</span>
                    </div>
                    <div class="border border-gray-700 p-4 rounded-lg flex justify-between">
                        <span>Payment Service</span>
                        <span class="text-green-400">Deployed</span>
                    </div>
                    <div class="border border-gray-700 p-4 rounded-lg flex justify-between">
                        <span>Auth Service</span>
                        <span class="text-yellow-400">Building</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
