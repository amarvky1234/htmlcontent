<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between">
            <h1 class="text-2xl font-bold text-blue-600">
                JobFinder
            </h1>
            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg">
                Post a Job
            </button>
        </div>
    </nav>

    <!--Search-->
    <section class="bg-blue-600 text-white">
        <div class="max-w-6xl mx-auto px-6 py-16">
            <h1 class="text-4xl font-bold text-center">
                Find Your Dream Job
            </h1>
            <div class="bg-white p-3 rounded-xl mt-8
                    flex flex-col md:flex-row gap-3">
                <input class="flex-1 px-4 py-3 text-gray-800 outline-none"
                    placeholder="Job title or keyword"
                >
                <input class="flex-1 px-4 py-3 text-gray-800 outline-none"
                    placeholder="Location"
                >
                <button class="bg-blue-600 text-white px-7 py-3 rounded-lg">
                    Search
                </button>
            </div>   
        </div>
    </section>

    <!--Jobs-->
    <section class="max-w-6xl mx-auto px-6 py-14">
        <h2 class="text-2xl font-bold mb-4">
            Latest Jobs
        </h2>

        <div class="space-y-5">
            <div class="bg-white p-6 rounded-xl shadow flex flex-col md:flex-row justify-between gap-5">
                <div>
                    <h3 class="text-xl font-bold">
                        React Developer
                    </h3>
                    <p class="text-blue-600 mt-1">
                        Tech Solution Pvt Ltd
                    </p>
                    <p class="text-gray-500 mt-2">
                       📍 Hyderabad · 💼 Full Time 
                    </p>
                </div>
                <button class="bg-blue-600 text-white px-6 py-3 rounded-lg">
                    Apply Now
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow flex flex-col md:flex-row justify-between gap-5">
                <div>
                    <h3 class="text-xl font-bold">
                        Node.js Developer
                    </h3>
                    <p class="text-blue-600 mt-1">
                        Software Labs
                    </p>
                    <p class="text-gray-500 mt-2">
                       📍 Bangalore · 💼 Full Time 
                    </p>
                </div>
                <button class="bg-blue-600 text-white px-6 py-3 rounded-lg">
                    Apply Now
                </button>
            </div>

            <div class="bg-white p-6 rounded-xl shadow flex flex-col md:flex-row justify-between gap-5">
                <div>
                    <h3 class="text-xl font-bold">
                        Backend Engineer
                    </h3>
                    <p class="text-blue-600 mt-1">
                        Digital Solutions
                    </p>
                    <p class="text-gray-500 mt-2">
                       📍 Pune · 💼 Remote
                    </p>
                </div>
                <button class="bg-blue-600 text-white px-6 py-3 rounded-lg">
                    Apply Now
                </button>
            </div>
        </div>
    </section>
</body>
</html>
