<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-white flex items-center justify-center">
    
    <div class="text-center">
        <h1 class="text-9xl font-black text-blue-500">
            404
        </h1>
        <h2 class="text-3xl font-bold mt-5">
            Page Not Found
        </h2>
        <p class="text-gray-400 mt-4">
            Sorry, the page you're looking for
            doesn't exist.
        </p>
        <button class="mt-8 bg-blue-600 px-7 py-3 rounded-lg font-semibold hover:bg-blue-700">
            ← Go Back Home
        </button>
    </div>
</body>
</html>
