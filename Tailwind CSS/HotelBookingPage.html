<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Booking<</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <nav class="bg-white shadow px-6 py-5">
        <div class="max-w-6xl mx-auto flex justify-between">
            <h1 class="text-2xl font-bold text-blue-600">StayEasy</h1>
            <button>Login</button>
        </div>
    </nav>

    <section class="bg-blue-600 text-white py-16">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="text-4xl font-bold">
                Find Your Perfect Stay
            </h2>

            <div class="bg-white text-black p-5 rounded-xl mt-8 grid md:grid-cols-4 gap-4">
                <input placeholder="Destination"
                    class="border p-3 rounded"
                >
                <input type="date"
                    class="border p-3 rounded"
                >
                <input type="date"
                    class="border p-3 rounded"
                >
                <button class="bg-blue-600 text-white rounded">
                    Search
                </button>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-6 py-12">
        <h2 class="text-3xl font-bold">Popular Hotels</h2>

        <div class="grid md:grid-cols-3 gap-6 mt-8">

            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="h-48 bg-blue-200 flex items-center justify-center text-7xl">
                    🏨
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Grand Palace Hotel</h3>
                    <p class="text-gray-500">Hyderabad</p>
                    <div class="flex justify-between mt-5">
                        <span>⭐ 4.8</span>
                        <b>₹3,500/night</b>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-3 rounded-lg mt-5">
                        View Hotel
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="h-48 bg-green-200 flex items-center justify-center text-7xl">
                    🏝️
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">Beach Resort</h3>
                    <p class="text-gray-500">Goa</p>
                    <div class="flex justify-between mt-5">
                        <span>⭐ 4.6</span>
                        <b>₹5,000/night</b>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-3 rounded-lg mt-5">
                        View Hotel
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow overflow-hidden">
                <div class="h-48 bg-purple-200 flex items-center justify-center text-7xl">
                    🏢
                </div>

                <div class="p-5">
                    <h3 class="text-xl font-bold">City View Hotel</h3>
                    <p class="text-gray-500">Bengaluru</p>
                    <div class="flex justify-between mt-5">
                        <span>⭐ 4.5</span>
                        <b>₹2,800/night</b>
                    </div>
                    <button class="w-full bg-blue-600 text-white py-3 rounded-lg mt-5">
                        View Hotel
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
