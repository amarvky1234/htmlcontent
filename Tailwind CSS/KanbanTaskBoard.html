<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <nav class="bg-white shadow">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between">
            <h1 class="text-2xl font-bold">
                TaskBoard
            </h1>
            <button class="bg-blue-600 text-white px-5 py-2 rounded-lg">
                + New Task
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold">
            Projects Tasks
        </h1>
        <div class="grid md:grid-cols-3 gap-6 mt-8">
            <!--TODO-->
            <div class="bg-gray-200 rounded-xl p-4">
                <div class="flex justify-between mb-5">
                    <h2 class="font-bold">
                        To Do
                    </h2>
                    <span class="bg-gray-300 px-3 py-1 rounded">
                        3
                    </span>
                </div>

                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <span class="text-xs bg-red-100 text-red-600 px-2 py-1 rounded">
                            High
                        </span>
                        <h3 class="font-bold mt-3">
                            Create Login Page
                        </h3>
                        <p class="text-gray-500 text-sm mt-2">
                            Design responsive login page.
                        </p>
                        <div class="flex justify-between mt-5 text-sm">
                            <span>👤 Amar</span>
                            <span>📅 Sep 15</span>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <span class="text-xs bg-yellow-100 text-yellow-600 px-2 py-1 rounded">
                            Medium
                        </span>
                        <h3 class="font-bold mt-3">
                            Create API
                        </h3>
                        <p class="text-gray-500 text-sm mt-2">
                            Develop user REST API.
                        </p>
                    </div>
                </div>
            </div>

            <!--IN PROGRESS-->
            <div class="bg-blue-200 rounded-xl p-4">
                <div class="flex justify-between mb-5">
                    <h2 class="font-bold">
                        In Progress
                    </h2>
                    <span class="bg-blue-300 px-2 py-1 rounded">
                        2
                    </span>
                </div>

                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">
                            Working
                        </span>
                        <h3 class="font-bold mt-3">
                            Dashboard UI
                        </h3>
                        <p class="text-gray-500 text-sm mt-2">
                            Build admin dashboard.
                        </p>
                    </div>
                </div>
            </div>

            <!--DONE-->
            <div class="bg-green-100 rounded-xl p-4">
                <div class="flex justify-between mb-5">
                    <h2 class="font-bold">
                        Completed
                    </h2>
                    <span class="bg-green-200 px-2 py-1 rounded">
                        4
                    </span>
                </div>
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-xl shadow-sm">
                        <span class="text-xs bg-green-100 text-green-600 px-2 py-1 rounded">
                            Done
                        </span>
                        <h3 class="font-bold mt-3">
                            Database Setup
                        </h3>
                        <p class="text-gray-500 text-sm mt-2">
                            MongoDB configuration completed.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
