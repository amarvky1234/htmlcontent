<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="flex min-h-screen">

        <!-- Sidebar -->
        <aside class="hidden md:block w-64 bg-gray-900 text-white p-6">

            <h1 class="text-2xl font-bold mb-10">
                AdminPanel
            </h1>

            <nav class="space-y-4">

                <a href="#" class="block bg-blue-600 px-4 py-3 rounded-lg">
                    Dashboard
                </a>

                <a href="#" class="block px-4 py-3 hover:bg-gray-800 rounded-lg">
                    Users
                </a>

                <a href="#" class="block px-4 py-3 hover:bg-gray-800 rounded-lg">
                    Orders
                </a>

                <a href="#" class="block px-4 py-3 hover:bg-gray-800 rounded-lg">
                    Products
                </a>

                <a href="#" class="block px-4 py-3 hover:bg-gray-800 rounded-lg">
                    Settings
                </a>

            </nav>

        </aside>

        <!-- Content -->
        <main class="flex-1 p-6 md:p-10">

            <div class="flex flex-col sm:flex-row justify-between gap-4 mb-8">

                <div>
                    <h1 class="text-3xl font-bold">
                        Users
                    </h1>

                    <p class="text-gray-500">
                        Manage registered users
                    </p>
                </div>

                <button class="bg-blue-600 text-white px-5 py-3 rounded-lg">
                    + Add User
                </button>

            </div>

            <!-- Search -->
            <div class="bg-white p-5 rounded-xl shadow mb-6">

                <input type="text" placeholder="Search users..."
                    class="w-full md:w-96 px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">

            </div>

            <!-- Table -->
            <div class="bg-white rounded-xl shadow overflow-hidden">

                <div class="overflow-x-auto">

                    <table class="w-full">

                        <thead class="bg-gray-50">

                            <tr class="text-left">

                                <th class="p-5">User</th>
                                <th class="p-5">Email</th>
                                <th class="p-5">Role</th>
                                <th class="p-5">Status</th>
                                <th class="p-5">Action</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr class="border-t">

                                <td class="p-5 flex items-center gap-3">

                                    <div
                                        class="w-10 h-10 bg-blue-500 text-white rounded-full flex items-center justify-center">
                                        A
                                    </div>

                                    <span class="font-semibold">
                                        Amarjeet
                                    </span>

                                </td>

                                <td class="p-5 text-gray-500">
                                    amar@example.com
                                </td>

                                <td class="p-5">
                                    Admin
                                </td>

                                <td class="p-5">
                                    <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm">
                                        Active
                                    </span>
                                </td>

                                <td class="p-5">
                                    <button class="text-blue-600 mr-3">
                                        Edit
                                    </button>

                                    <button class="text-red-600">
                                        Delete
                                    </button>
                                </td>

                            </tr>

                            <tr class="border-t">

                                <td class="p-5 flex items-center gap-3">

                                    <div
                                        class="w-10 h-10 bg-purple-500 text-white rounded-full flex items-center justify-center">
                                        R
                                    </div>

                                    <span class="font-semibold">
                                        Rahul
                                    </span>

                                </td>

                                <td class="p-5 text-gray-500">
                                    rahul@example.com
                                </td>

                                <td class="p-5">
                                    User
                                </td>

                                <td class="p-5">
                                    <span class="bg-yellow-100 text-yellow-700 px-3 py-1 rounded-full text-sm">
                                        Pending
                                    </span>
                                </td>

                                <td class="p-5">
                                    <button class="text-blue-600 mr-3">
                                        Edit
                                    </button>

                                    <button class="text-red-600">
                                        Delete
                                    </button>
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</body>

</html>
