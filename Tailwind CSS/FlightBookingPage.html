<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Booking</title>
    <script src="https:cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <nav class="bg-white shadow px-6 py-5">
        <div class="max-w-6xl mx-auto flex justify-between">
            <h1 class="text-2xl font-bold text-blue-600">FlyEasy ✈️</h1>
            <button>Login</button>
        </div>
    </nav>

    <section class="bg-blue-700 text-white py-16">
        <div class="max-w-6xl mx-auto px-6">
            <h2 class="text-4xl font-bold">Search Flights</h2>

            <div class="bg-white text-black rounded-xl p-6 mt-8">
                <div class="flex gap-6 mb-6">
                    <label>
                        <input type="radio" checked>
                        Round Trip
                    </label>
                    <label>
                        <input type="radio">
                        One Way
                    </label>
                </div>

                <div class="grid md:grid-cols-5 gap-4">
                    <input class="border p-3 rounded" placeholder="From">
                    <input class="border p-3 rounded" placeholder="To">
                    <input type="date" class="border p-3 rounded">
                    <select class="border p-3 rounded">
                        <option>1 Passenger</option>
                        <option>2 Passengers</option>
                    </select>
                    <button class="bg-blue-600 text-white rounded">
                        Search
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto p-6">
        <h2 class="text-2xl font-bold">Available Flights</h2>

        <div class="bg-white shadow rounded-xl mt-6 p-6">
            <div class="grid md:grid-cols-5 gap-5 items-center">
                <div>
                    <b>IndiGo</b>
                    <p class="text-gray-500">6E 204</p>
                </div>
                <div>
                    <b>10:00 AM</b>
                    <p>HYD</p>
                </div>
                <div class="text-center">
                    ✈️
                    <p class="text-gray-500">2h 10m</p>
                </div>
                <div>
                    <b>12:10 PM</b>
                    <p>DEL</p>
                </div>
                <div>
                    <b>₹5,499</b>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded ml-3">
                        Select
                    </button>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
