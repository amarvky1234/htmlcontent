<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-blue-600 to-indigo-800 flex items-center justify-center px-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">

        <div class="text-center mb-8">
            <div class="text-5xl mb-3">🔐</div>
            <h1 class="text-3xl font-bold text-gray-800">
                Welcome Back
            </h1>
            <p class="text-gray-500 mt-2">
                Login to your account
            </p>
        </div>

        <form>

            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">
                    Email
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>

            <div class="flex justify-between items-center mb-6 text-sm">
                <label>
                    <input type="checkbox" class="mr-2">
                    Remember me
                </label>

                <a href="#" class="text-blue-600 hover:underline">
                    Forgot Password?
                </a>
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Login
            </button>

        </form>

        <p class="text-center text-gray-500 mt-6">
            Don't have an account?
            <a href="#" class="text-blue-600 font-semibold">
                Register
            </a>
        </p>

    </div>

</body>
</html>
