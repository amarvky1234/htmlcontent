<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <div class="max-w-7xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center">
            <div>
                <p class="text-gray-500">
                    Welcome back
                </p>
                <h1 class="text-3xl font-bold">
                    Amarjeet
                </h1>
            </div>
            <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">
                A
            </div>
        </div>

        <!--Balance-->
        <div class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white rounded-2xl p-6 mt-8">
            <p class="text-blue-200">
                Total Balance
            </p>
            <h2 class="text-4xl font-bold mt-3">
                ₹1,25,450.00
            </h2>
            <div class="flex justify-between mt-10">
                <div>
                    <p class="text-blue-200">
                        Account
                    </p>
                    <p>
                        **** 4582
                    </p>
                </div>
                <div>
                    <p class="text-blue-200">
                        Valid Thru
                    </p>
                    <p>
                        12/28
                    </p>
                </div>
            </div>
        </div>

        <!--Stats-->
        <div class="grid md:grid-cols-3 gap-5 mt-8">
            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">
                    Income
                </p>
                <h2 class="text-2xl font-bold text-green-600 mt-2">
                    +₹45,000
                </h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">
                    Income
                </p>
                <h2 class="text-2xl font-bold text-red-600 mt-2">
                    -₹18,500
                </h2>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">
                    Savings
                </p>
                <h2 class="text-2xl font-bold text-blue-600 mt-2">
                    ₹26,500
                </h2>
            </div>
        </div>

        <!--Transactions-->
        <div class="bg-white rounded-xl shadow mt-8">
            <div class="p-6 border-b">
                <h2 class="text-xl font-bold">
                    Recent Transactions
                </h2>
            </div>

            <div class="divide-y">
                <div class="p-5 flex items-center gap-4">
                    <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                        🛒
                    </div>

                    <div class="flex-1">
                        <h3 class="font-semibold">
                            Amazon Purchase
                        </h3>
                        <p class="text-gray-400 text-sm">
                            Today
                        </p>
                    </div>

                    <span class="text-red-600 font-bold">
                        -₹2,450
                    </span>
                </div>

                <div class="p-5 flex">
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center">
                        💰
                    </div>
                    <div class="flex-1">
                        <h3 class="font-semibold">
                            Salary
                        </h3>
                        <p class="text-gray-400 text-sm">
                            Sep 01
                        </p>
                    </div>

                    <span class="text-green-600 font-bold">
                        +₹45,000
                    </span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
