<!DOCTYPE html>
<html>

<head>
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden">

        <!-- Cover -->
        <div class="h-32 bg-gradient-to-r from-purple-500 to-pink-500"></div>

        <!-- Profile -->
        <div class="px-8 pb-8 text-center">

            <div class="w-28 h-28 bg-gray-200 rounded-full
                        mx-auto -mt-14 border-4 border-white
                        flex items-center justify-center text-6xl">
                👨‍💻
            </div>

            <h1 class="text-2xl font-bold mt-4">
                Amarjeet Kumar
            </h1>

            <p class="text-purple-600 font-semibold">
                Full Stack Developer
            </p>

            <p class="text-gray-500 mt-3">
                Passionate developer who loves building
                modern web applications.
            </p>

            <!-- Stats -->
            <div class="grid grid-cols-3 border-t border-b
                        my-6 py-5">

                <div>
                    <h3 class="font-bold text-xl">120</h3>
                    <p class="text-gray-500 text-sm">Posts</p>
                </div>

                <div>
                    <h3 class="font-bold text-xl">5.2K</h3>
                    <p class="text-gray-500 text-sm">Followers</p>
                </div>

                <div>
                    <h3 class="font-bold text-xl">450</h3>
                    <p class="text-gray-500 text-sm">Following</p>
                </div>

            </div>

            <button class="w-full bg-purple-600 text-white
                           py-3 rounded-lg font-semibold
                           hover:bg-purple-700">
                Follow
            </button>

        </div>

    </div>

</body>

</html>
