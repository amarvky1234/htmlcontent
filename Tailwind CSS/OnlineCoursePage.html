<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Course</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    
    <section class="bg-gray-900 text-white">
        <div class="max-w-6xl mx-auto px-6 py-16">
            <div class="grid md:grid-cols-2 gap-10 items-center">
                <div>
                    <span class="bg-blue-600 px-3 py-1 rounded-full text-sm">
                        BEST SELLER
                    </span>
                    <h1 class="text-4xl md:text-5xl font-bold mt-5">
                        Complete React
                        Development Course
                    </h1>
                    <p class="text-gray-400 mt-5 text-lg">
                        Learn React from beginner
                        to advanced level and build
                        real-world applications.
                    </p>
                    <div class="flex gap-6 mt-6">
                        <span>⭐ 4.8 Rating</span>
                        <span>👨‍🎓 12K Students</span>
                    </div>
                </div>

                <div class="bg-gray-800 rounded-2xl p-8">
                    <div class="h-48 bg-gradient-to-br from-blue-600 to-purple-600
                        rounded-xl flex items-center justify-center text-7xl">
                        ⚛️
                    </div>
                    <p class="text-3xl font-bold mt-6">
                        ₹999
                    </p>
                    <button class="w-full bg-blue-600 py-3 rounded-lg mt-5 font-semibold">
                        Enroll Now
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Course Content -->
    <section class="max-w-6xl mx-auto px-6 py-12">
        <h2 class="text-3xl font-bold">
            Course Content
        </h2>
        <div class="bg-white rounded-xl shadow mt-6">
            <div class="p-5 border-b flex justify-between">
                <span>
                    01. Introduction to React
                </span>
                <span>
                    15 min
                </span>
            </div>
            <div class="p-5 border-b flex justify-between">
                <span>
                    02. Components & Props
                </span>
                <span>
                    25 min
                </span>
            </div>
            <div class="p-5 border-b flex justify-between">
                <span>
                    03. React Hooks
                </span>
                <span>
                    35 min
                </span>
            </div>
            <div class="p-5 border-b flex justify-between">
                <span>
                    04. React Router
                </span>
                <span>
                    30 min
                </span>
            </div>
        </div>
    </section>
</body>
</html>
