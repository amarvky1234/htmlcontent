<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-50">
    
    <nav class="max-w-6xl mx-auto px-6 py-5 flex justify-between">
        <h1 class="text-2xl font-bold text-purple-600">TaskFlow</h1>
        <button class="bg-purple-600 text-white px-5 py-2 rounded-lg">
            Download
        </button>
    </nav>

    <section class="max-w-6xl mx-auto px-6 py-20 grid md:grid-cols-2 gap-12 items-center">
        <div>
            <p class="text-purple-600 font-semibold">PRODUCTIVITY APP</p>
            <h2 class="text-5xl font-bold mt-4">
                Manage Your Tasks Easily
            </h2>
            <p class="text-gray-600 text-lg mt-6">
                Organize your work, track your goals and become more productive
                with TaskFlow.
            </p>
            <div class="flex gap-4 mt-8">
                <button class="bg-black text-white px-6 py-3 rounded-lg">
                     App Store
                </button>
                <button class="bg-black text-white px-6 py-3 rounded-lg">
                    ▶ Google Play
                </button>
            </div>
        </div>

        <div class="flex justify-center">
            <div class="bg-gray-900 w-64 h-[500px] rounded-[40px] p-5 shadow-2xl">
                <div class="bg-white h-full rounded-[30px] p-5">
                    <h3 class="font-bold">TaskFlow</h3>

                    <div class="bg-purple-100 p-4 rounded-xl mt-6">
                        <p class="font-bold">Today's Tasks</p>
                        <p class="text-gray-500 mt-2">8 Tasks</p>
                    </div>

                    <div class="space-y-3 mt-5">
                        <div class="border p-3 rounded-lg">✓ Complete Project</div>
                        <div class="border p-3 rounded-lg">✓ Read Book</div>
                        <div class="border p-3 rounded-lg">○ Exercise</div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
