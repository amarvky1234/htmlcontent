<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600">
                Create Account
            </h1>

            <p class="text-gray-500 mt-2">
                Register to get started
            </p>
        </div>

        <form>

            <div class="grid md:grid-cols-2 gap-5">

                <div>
                    <label class="block font-semibold mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        placeholder="Enter full name"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        placeholder="Enter email"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Phone
                    </label>

                    <input
                        type="tel"
                        placeholder="Enter phone number"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Date of Birth
                    </label>

                    <input
                        type="date"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Create password"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block font-semibold mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        placeholder="Confirm password"
                        class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

            </div>

            <div class="mt-5">
                <label class="block font-semibold mb-2">
                    Address
                </label>

                <textarea
                    rows="3"
                    placeholder="Enter your address"
                    class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                ></textarea>
            </div>

            <div class="mt-5">
                <label class="flex items-center gap-2">
                    <input type="checkbox">
                    <span class="text-gray-600">
                        I agree to the Terms & Conditions
                    </span>
                </label>
            </div>

            <button
                class="w-full mt-7 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Create Account
            </button>

        </form>

    </div>

</body>
</html>
