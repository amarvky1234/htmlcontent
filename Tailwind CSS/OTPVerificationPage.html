<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-blue-50 flex items-center justify-center p-6">
    
    <div class="bg-white max-w-md w-full p-8 rounded-2xl shadow-lg text-center">
        <div class="text-6xl">🔐</div>
        <h1 class="text-3xl font-bold mt-5">
            Verify OTP
        </h1>
        <p class="text-gray-500 mt-3">
            Enter the 6-digit OTP sent to your email.
        </p>
        <div class="flex justify-center gap-3 mt-8">
            <input maxlength="1" class="w-12 h-14 border rounded-lg text-center text-2xl">
            <input maxlength="1" class="w-12 h-14 border rounded-lg text-center text-2xl">
            <input maxlength="1" class="w-12 h-14 border rounded-lg text-center text-2xl">
            <input maxlength="1" class="w-12 h-14 border rounded-lg text-center text-2xl">
            <input maxlength="1" class="w-12 h-14 border rounded-lg text-center text-2xl">
            <input maxlength="1" class="w-12 h-14 border rounded-lg text-center text-2xl">
        </div>
        <button class="w-full bg-blue-600 text-white py-3 rounded-lg mt-8">
            Verify OTP
        </button>
        <p class="text-gray-500 mt-6">
            Didn't receive OTP?
            <button class="text-blue-600 font-semibold">
                Resend
            </button>
        </p>
    </div>
</body>
</html>
