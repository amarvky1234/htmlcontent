<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <script src="https:/cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50">
    
    <div class="max-w-6xl mx-auto px-6 py-16">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold">
                Get In Touch
            </h1>

            <p class="text-gray-500 mt-3">
                We'd love to hear from you.
            </p>
        </div>
        
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden grid md:grid-cols-2">

            <!--Contact Info-->
            <div class="bg-blue-600 text-white p-10">
                <h2 class="text-3xl font-bold">
                    Conatct Information
                </h2>

                <p class="text-blue-100 mt-4">
                    Have a question? Send us a message and
                    we'll get back to you.
                </p>

                <div class=space-y-6 mt-10">
                    <div class="flex gap-4">
                        <span class="text-2xl">📍</span>
                        <div>
                            <h3 class="font-bold">Address</h3>
                            <p class="text-blue-100">
                                Hyderabad, Telangana
                            </p>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <span class="text-2xl">📧</span>
                        <div>
                            <h3 class="font-bold">Email</h3>
                            <p class="text-blue-100">
                                riya@gmail.com
                            </p>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <span class="text-2xl">📞</span>
                        <div>
                            <h3 class="font-bold">Phone</h3>
                            <p class="text-blue-100">
                                +91 6737997766
                            </p>
                        </div>
                    </div>
                </div>

            </div>

            <!--Form-->
            <div class="p-10">
                <form>
                    <div class="mb-5">
                        <label class="font-semibold">Name</label>
                        <input type="text"
                            placeholder="Your name"
                            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-blue-500 outline-none"
                        >
                    </div>

                    <div class="mb-5">
                        <label class="font-semibold">Email</label>
                        <input type="email"
                            placeholder="Your email"
                            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-blue-500 outline-none"
                        >
                    </div>

                    <div class="mb-5">
                        <label class="font-semibold">Subject</label>
                        <input type="text"
                            placeholder="Subject"
                            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-blue-500 outline-none"
                        >
                    </div>

                    <div class="mb-5">
                        <label class="font-semibold">Message</label>
                        <textarea
                            rows="5"
                            placeholder="Write your message..."
                            class="w-full mt-2 px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                        ></textarea>
                    </div>

                    <button class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700">
                        Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
