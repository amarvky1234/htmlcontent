<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-950 text-white flex items-center justify-center px-6">
    
    <div class="text-center max-w-3xl">
        <div class="text-7xl mb-8">
            🚀
        </div>
        <p class="text-blue-400 font-semibold">
            SOMETHING BIG IS COMING
        </p>
        <h1 class="text-5xl md:text-7xl font-bold mt-4">
            Coming Soon
        </h1>
        <p class="text-gray-400 text-lg mt-6">
            We're working hard to bring
            something amazing to you.
        </p>

        <!--Countdown-->
        <div class="grid grid-cols-4 gap-4 mt-10">
            <div class="bg-gray-800 rounded-xl p-5">
                <h2 class="text-3xl font-bold">
                    12
                </h2>
                <p class="text-gray-400">
                    Days
                </p>
            </div>

            <div class="bg-gray-800 rounded-xl p-5">
                <h2 class="text-3xl font-bold">
                    08
                </h2>
                <p class="text-gray-400">
                    Hours
                </p>
            </div>

            <div class="bg-gray-800 rounded-xl p-5">
                <h2 class="text-3xl font-bold">
                    35
                </h2>
                <p class="text-gray-400">
                    Mintues
                </p>
            </div>

            <div class="bg-gray-800 rounded-xl p-5">
                <h2 class="text-3xl font-bold">
                    20
                </h2>
                <p class="text-gray-400">
                    Seconds
                </p>
            </div>
        </div>

        <div class="flex mt-10">
            <input type="email" 
                placeholder="Enter your email"
                class="flex-1 px-5 py-3 rounded-l-lg text-gray-800 outline-none">
            <button class="bg-blue-600 px-6 py-3 rounded-r-lg font-semibold">
                Notify Me
            </button>
        </div>
    </div>
</body>
</html>
