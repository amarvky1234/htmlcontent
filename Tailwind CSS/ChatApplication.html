<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <div class="max-w-6xl mx-auto h-screen md:h-[700px] md:py-8">
        <div class="bg-white h-full md:rounded-2xl shadow overflow-hidden flex">
            <!--Users-->
            <aside class="hidden md:block w-80 border-r">
                <div class="p-5 border-b">
                    <h1 class="text-2xl font-bold">
                        Message
                    </h1>
                    <input placeholder="Search" class="w-full">
                </div>

                <div class="p-4 bg-blue-50 flex gap-3">
                    <div class="w-12 h-12 bg-blue-500 rounded-full flex
                        items-center justify-center text-white">
                        R
                    </div>
                    <div>
                        <h3 class="font-bold">
                            Rahul
                        </h3>
                        <p class="text-gray-500 text-sm">
                            Hey, how are you?
                        </p>
                    </div>
                </div>

                <div class="p-4 flex gap-3">

                    <div class="w-12 h-12 bg-purple-500 rounded-full flex
                        items-center justify-center text-white">
                        P
                    </div>
                    <div>
                        <h3 class="font-bold">
                            Priya
                        </h3>
                        <p class="text-gray-500 text-sm">
                            See you tomorrow!
                        </p>
                    </div>
                </div>
            </aside>

            <!--Chat-->
            <section class="flex-1 flex flex-col">
                <!--Header-->
                <div class="p-5 border-b flex items-center gap-3">
                    <div class="w-12 h-12 bg-blue-500 text-white rounded-full
                        flex items-center justify-center">
                        R
                    </div>
                    <div>
                        <h2 class="font-bold">
                            Rahul
                        </h2>
                        <p class="text-green-500 text-sm">
                            Online
                        </p>
                    </div>
                </div>

                <!--Message-->
                <div class="flex-1 p-6 space-y-5">
                    <div class="flex">
                        <div class="bg-gray-100 px-5 py-3 rounded-2xl">
                            Hey! How are you?
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <div class="bg-blue-500 text-white px-5 py-3 rounded-2xl">
                            I'm good! What about you?
                        </div>
                    </div>

                    <div class="flex">
                        <div class="bg-gray-100 px-5 py-3 rounded-2xl">
                            I'm doing great! 😊
                        </div>
                    </div>

                    <div class="flex justify-end">
                        <div class="bg-blue-500 text-white px-5 py-3 rounded-2xl">
                            That's awesome!
                        </div>
                    </div>
                </div>

                <!--Input-->
                <div class="p-4 border-t">
                    <div class="flex gap-3">
                        <input placeholder="Type a message"
                            class="flex-1 bg-gray-100 px-5 py-3 rounded-full outline-none">

                        <button class="bg-blue-600 text-white w-12 h-12 rounded-full">
                            ➤
                        </button>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>

</html>
