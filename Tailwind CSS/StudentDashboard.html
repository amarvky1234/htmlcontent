<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <nav class="bg-white shadow px-6 py-5">
        <div class="max-w-7xl mx-auto flex justify-between">
            <h1 class="text-2xl font-bold text-blue-600">StudentHub</h1>
            <span>👨‍🎓 Amar</span>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6">
        <h2 class="text-3xl font-bold">Welcome, Amar!</h2>

        <div class="grid md:grid-cols-3 gap-6 mt-8">

            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Courses</p>
                <h3 class="text-4xl font-bold">6</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Assignments</p>
                <h3 class="text-4xl font-bold">12</h3>
            </div>
            <div class="bg-white p-6 rounded-xl shadow">
                <p class="text-gray-500">Attendance</p>
                <h3 class="text-4xl font-bold">89%</h3>
            </div>
        </div>

        <section class="mt-10">
            <h2 class="text-2xl font-bold">My Courses</h2>

            <div class="grid md:grid-cols-3 gap-6 mt-6">
                <div class="bg-white p-6 rounded-xl shadow">
                    <div class="text-5xl">☕</div>
                    <h3 class="text-xl font-bold mt-4">Java</h3>
                    <p class="text-gray-500 mt-2">72% completed</p>
                    <div class="bg-gray-200 h-2 mt-4 rounded">
                        <div class="bg-blue-600 h-2 w-3/4 rounded"></div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <div class="text-5xl">⚛️</div>
                    <h3 class="text-xl font-bold mt-4">React</h3>
                    <p class="text-gray-500 mt-2">85% completed</p>
                    <div class="bg-gray-200 h-2 mt-4 rounded">
                        <div class="bg-blue-600 h-2 w-5/6 rounded"></div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <div class="text-5xl">🗄️</div>
                    <h3 class="text-xl font-bold mt-4">MongoDB</h3>
                    <p class="text-gray-500 mt-2">65% completed</p>
                    <div class="bg-gray-200 h-2 mt-4 rounded">
                        <div class="bg-blue-600 h-2 w-2/3 rounded"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
