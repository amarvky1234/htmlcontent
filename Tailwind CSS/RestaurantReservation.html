<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100">
    
    <section class="max-w-5xl mx-auto px-6 py-12">
        <div class="bg-white rounded-3xl shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-orange-500 to-red-500
                        text-white p-10">
                <p class="text-orange-100">
                    WELCOME TO
                </p>
                <h1 class="text-4xl font-bold mt-2">
                    The Golden Plate
                </h1>
                <p class="mt-3 text-orange-100">
                    Fine dining experience
                    in the heart of the city.
                </p>
            </div>

            <div class="p-8">
                <h2 class="text-2xl font-bold">
                    Reserve a Table
                </h2>

                <div class="grid md:grid-cols-2 gap-6 mt-8">
                    <div>
                        <label class="font-semibold">
                            Date
                        </label>
                        <input type="date" 
                            class="w-full mt-2 border rounded-lg px-4 py-3">
                    </div>

                    <div>
                        <label class="font-semibold">
                            Time
                        </label>
                        <select class="w-full mt-2 border rounded-lg px-4 py-3">
                            <option>7:00 PM</option>
                            <option>7:30 PM</option>
                            <option>8:00 PM</option>
                            <option>8:30 PM</option>
                            <option>9:00 PM</option>
                        </select>
                    </div>

                    <div>
                        <label class="font-semibold">
                            Guests
                        </label>

                        <select class="w-full mt-2 border rounded-lg px-4 py-3">
                            <option>2 Guests</option>
                            <option>3 Guests</option>
                            <option>4 Guests</option>
                            <option>5 Guests</option>
                            <option>6 Guests</option>
                        </select>
                    </div>

                    <div>
                        <label class="font-semibold">
                            Seating
                        </label>

                        <select class="w-full mt-2 border rounded-lg px-4 py-3">
                            <option>Indoor</option>
                            <option>Outdoor</option>
                            <option>Window</option>
                        </select>
                    </div>
                </div>

                <button class="w-full mt-8 bg-orange-500 text-white py-3
                            rounded-lg font-semibold hover:bg-orange-600">
                    Reserve Table
                </button>
            </div>
        </div>
    </section>
</body>
</html>
