<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    
    <div class="flex min-h-screen">
        <aside class="hidden md:block w-64 bg-gray-900 text-white p-6">
            <h1 class="text-2xl font-bold">Analytics</h1>

            <div class="space-y-4 mt-10">
                <p class="bg-gray-700 p-3 rounded">Dashboard</p>
                <p class="p-3">Reports</p>
                <p class="p-3">Customers</p>
                <p class="p-3">Revenue</p>
                <p class="p-3">Settings</p>
            </div>
        </aside>

        <main class="flex-1 p-6">
            <h2 class="text-3xl font-bold">Analytics Overview</h2>

            <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5 mt-8">
                <div class="bg-white p-6 rounded-xl shadow">
                    <p class="text-gray-500">Visitors</p>
                    <h3 class="text-3xl font-bold mt-2">48,520</h3>
                    <p class="text-green-600 mt-2">+12.5%</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <p class="text-gray-500">Sales</p>
                    <h3 class="text-3xl font-bold mt-2">₹5.8L</h3>
                    <p class="text-green-600 mt-2">+8.4%</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <p class="text-gray-500">Orders</p>
                    <h3 class="text-3xl font-bold mt-2">8,452</h3>
                    <p class="text-green-600 mt-2">+15%</p>
                </div>
                <div class="bg-white p-6 rounded-xl shadow">
                    <p class="text-gray-500">Bounce Rate</p>
                    <h3 class="text-3xl font-bold mt-2">32%</h3>
                    <p class="text-green-600 mt-2">+2%</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow p-6 mt-8">
                <h3 class="text-xl font-bold">Revenue Overview</h3>

                <div class="h-64 flex items-end gap-5 mt-8">
                    <div class="bg-blue-500 w-10 h-24"></div>
                    <div class="bg-blue-500 w-10 h-40"></div>
                    <div class="bg-blue-500 w-10 h-32"></div>
                    <div class="bg-blue-500 w-10 h-52"></div>
                    <div class="bg-blue-500 w-10 h-44"></div>
                    <div class="bg-blue-500 w-10 h-60"></div>
                    <div class="bg-blue-500 w-10 h-48"></div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
