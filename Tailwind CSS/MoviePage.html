<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
    
    <nav class="px-8 py-5 flex justify-between items-center">
        <h1 class="text-3xl font-bold text-red-600">MOVIEFLIX</h1>

        <div class="flex gap-6">
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Series</a>
            <a href="#">My List</a>
        </div>
    </nav>

    <section class="min-h-[500px] flex items-center px-8 bg-gradient-to-r
        from-black via-gray-900 to-gray-700">
        <div class="max-w-xl">
            <p class="text-red-500 font-bold">NEW RELEASE</p>
            <h2 class="text-6xl font-bold mt-4">The Last Journey</h2>
            <p class="text-gray-300 mt-6">
                A thrilling adventure begins when a group of explorers
                discovers a mysterious world.
            </p>

            <div class="flex gap-4 mt-8">
                <button class="bg-white text-black px-7 py-3 rounded-lg">
                    ▶ Play
                </button>
                <button class="bg-gray-700 px-7 py-3 rounded-lg">
                    + My List
                </button>
            </div>
        </div>
    </section>

    <section class="p-8">
        <h2 class="text-2xl font-bold">Popular Movies</h2>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-5 mt-6">
            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <div class="h-56 flex items-center justify-center text-7xl">🎬</div>
                <p class="p-3 font-bold">Dark Night</p>
            </div>

            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <div class="h-56 flex items-center justify-center text-7xl">🚀</div>
                <p class="p-3 font-bold">Space Mission</p>
            </div>

            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <div class="h-56 flex items-center justify-center text-7xl">🕵️</div>
                <p class="p-3 font-bold">Detective</p>
            </div>

            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <div class="h-56 flex items-center justify-center text-7xl">🏝️</div>
                <p class="p-3 font-bold">Island</p>
            </div>

            <div class="bg-gray-800 rounded-lg overflow-hidden">
                <div class="h-56 flex items-center justify-center text-7xl">⚔️</div>
                <p class="p-3 font-bold">Warrior</p>
            </div>
        </div>
    </section>
</body>
</html>
